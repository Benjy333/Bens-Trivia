<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben's Games — Anagram</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:72px 16px 32px}
    .game-card{width:min(520px,92vw);background:var(--bg2);border:1px solid var(--neon);border-radius:20px;box-shadow:0 0 24px rgba(55,161,255,.25), inset 0 0 30px rgba(150,208,255,.05);padding:20px}
    .title{font-size:1.6rem;text-align:center;margin-bottom:10px;text-shadow:0 0 8px var(--neon-soft)}
    .scramble{font-size:2.2rem;text-align:center;margin:10px 0 20px;letter-spacing:0.1em;font-weight:bold}
    input[type="text"]{flex:1;background:#021527;border:1px solid var(--neon);border-radius:12px;padding:14px;color:#e9f4ff;font-size:1.05rem}
    .btn{border:1px solid var(--neon);background:transparent;color:var(--neon);padding:12px 16px;border-radius:12px;cursor:pointer}
    .btn:hover{background:var(--neon);color:#001}
    .feedback{text-align:center;margin-top:10px;min-height:24px}
  </style>
</head>
<body>
  <header class="top-menu">
    <button id="menu-btn">☰</button>
    <div class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Ben's Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
    </div>
  </header>

  <main class="page-wrap">
    <div class="game-card">
      <h1 class="title">🔤 Anagram Game</h1>
      <div class="scramble" id="scramble">•••</div>
      <div style="display:flex;gap:10px">
        <input id="guess" type="text" placeholder="Type your guess…" />
        <button class="btn" id="check">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px">
        <button class="btn" id="hint">Hint</button>
        <button class="btn" id="shuffle">Shuffle</button>
        <button class="btn" id="next">Next</button>
      </div>
    </div>
  </main>

  <script>
    const words = ["river","cloud","planet","signal","neon","trivia","python","energy"];
    let current="";
    function shuffleLetters(str){return str.split('').sort(()=>Math.random()-0.5).join('');}
    function pick(){current=words[Math.floor(Math.random()*words.length)];document.getElementById('scramble').textContent=shuffleLetters(current);document.getElementById('feedback').textContent='';document.getElementById('guess').value='';}
    document.getElementById('check').onclick=()=>{const g=document.getElementById('guess').value.trim().toLowerCase();document.getElementById('feedback').textContent=g===current?"✅ Correct!":"❌ Try again."};
    document.getElementById('shuffle').onclick=()=>{document.getElementById('scramble').textContent=shuffleLetters(current)};
    document.getElementById('next').onclick=pick;
    document.getElementById('hint').onclick=()=>{document.getElementById('feedback').textContent=`Hint: starts with ${current[0]}`};
    pick();
  </script>
  <script>
    const btn=document.getElementById('menu-btn');const drop=document.getElementById('menu-dropdown');
    btn.onclick=()=>drop.style.display=drop.style.display==='block'?'none':'block';
    document.addEventListener('click',e=>{if(!btn.contains(e.target)&&!drop.contains(e.target))drop.style.display='none'});
  </script>
</body>
</html>
