<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben's Trivia</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #0a66c2 0%, #cbe2ff 100%);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      background-color: #004c99;
      width: 100%;
      text-align: center;
      color: white;
      padding: 20px 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2em;
      margin: 0;
      letter-spacing: 1px;
    }

    .container {
      background: #ffffff;
      width: 90%;
      max-width: 500px;
      margin-top: 50px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h2 {
      color: #333;
    }

    button {
      background-color: #0a66c2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #004c99;
      transform: scale(1.05);
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    #nextBtn {
      display: none;
      margin-top: 20px;
    }

    footer {
      margin-top: auto;
      padding: 15px;
      color: white;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎯 Ben's Trivia</h1>
  </header>

  <div class="container">
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="result"></p>
    <button id="nextBtn">Next Question</button>
  </div>

  <footer>
    Made by Benjy333 · Hosted on GitHub Pages
  </footer>

  <script>
    const questions = [
      { q: "What is the capital of Australia?", a: ["Sydney", "Melbourne", "Canberra", "Perth"], correct: 2 },
      { q: "Which planet is known as the Red Planet?", a: ["Earth", "Venus", "Mars", "Jupiter"], correct: 2 },
      { q: "What is the largest ocean on Earth?", a: ["Atlantic", "Indian", "Pacific", "Arctic"], correct: 2 },
      { q: "Who painted the Mona Lisa?", a: ["Van Gogh", "Da Vinci", "Picasso", "Michelangelo"], correct: 1 }
    ];

    let current = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const resultEl = document.getElementById("result");
    const nextBtn = document.getElementById("nextBtn");

    function showQuestion() {
      const q = questions[current];
      questionEl.textContent = q.q;
      answersEl.innerHTML = "";
      resultEl.textContent = "";
      nextBtn.style.display = "none";

      q.a.forEach((ans, i) => {
        const btn = document.createElement("button");
        btn.textContent = ans;
        btn.onclick = () => checkAnswer(i);
        answersEl.appendChild(btn);
      });
    }

    function checkAnswer(i) {
      const q = questions[current];
      if (i === q.correct) {
        score++;
        resultEl.textContent = "✅ Correct!";
        resultEl.style.color = "green";
      } else {
        resultEl.textContent = `❌ Wrong! The correct answer was ${q.a[q.correct]}.`;
        resultEl.style.color = "red";
      }
      nextBtn.style.display = "inline-block";
    }

    nextBtn.onclick = () => {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        questionEl.textContent = `Game Over! Your score: ${score}/${questions.length}`;
        answersEl.innerHTML = "";
        resultEl.textContent = "";
        nextBtn.style.display = "none";
      }
    };

    showQuestion();
  </script>
</body>
</html>
