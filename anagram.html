<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ben's Trivia — Anagram</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .logo-wrap{position:fixed;top:6px;width:100%;display:flex;justify-content:center;z-index:95}
    .logo-img{height:56px;width:auto;filter:drop-shadow(0 0 12px var(--neon)) drop-shadow(0 0 30px var(--neon-soft))}
    .wrap{min-height:100svh;display:grid;place-items:center;padding:96px 16px 32px}
    .game-card{width:min(640px,92vw)}
    .scramble{letter-spacing:.12em;font-weight:800;font-size:clamp(28px,6vw,44px);text-align:center;margin:6px 0 14px}
    .controls{display:grid;grid-template-columns:1fr auto;gap:10px}
    .toolbar{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
    .feedback{min-height:28px;text-align:center;margin-top:8px}
  </style>
</head>
<body>
  <header class="top-menu">
    <button id="menu-btn">☰</button>
    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Ben's Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
      <a href="connections.html">🧩 Connections</a>
    </nav>
  </header>
  <div class="logo-wrap"><img class="logo-img" src="logo.png" alt="Ben's Trivia logo" /></div>

  <main class="wrap">
    <section class="game-card card">
      <div class="scramble" id="scramble">•••</div>
      <div class="controls">
        <input id="guess" type="text" placeholder="Type your guess…" autocomplete="off"/>
        <button class="btn" id="check">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="toolbar">
        <button class="btn" id="hint">Hint</button>
        <button class="btn" id="shuffle">Shuffle</button>
        <button class="btn" id="next">New word</button>
      </div>
    </section>
  </main>

  <footer id="footerText"></footer>

  <script>
    // Menu + footer
    const mb=document.getElementById('menu-btn'), md=document.getElementById('menu-dropdown');
    mb.onclick=()=>md.style.display=md.style.display==='block'?'none':'block';
    document.addEventListener('click',e=>{if(!mb.contains(e.target)&&!md.contains(e.target))md.style.display='none'});
    const today=new Date();document.getElementById('footerText').textContent=`Made by Ben · Puzzle No. 1 · ${today.toLocaleDateString(undefined,{weekday:'long'})}, ${today.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`;

    // Game
    const scr=document.getElementById('scramble'), guess=document.getElementById('guess'), fb=document.getElementById('feedback');
    let current="";
    function shuffleLetters(str){const a=str.split('');for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} if(a.join('')===str) return shuffleLetters(str); return a.join('');}
    async function loadToday(){
      const data=await (await fetch('daily_content.json')).json();
      const start=new Date(data.start_date);
      const idx=Math.min(Math.floor((Date.now()-start)/86400000), data.anagrams.length-1);
      current=data.anagrams[idx].toLowerCase();
      scr.textContent=shuffleLetters(current); fb.textContent=""; guess.value=""; guess.focus();
    }
    function check(){const g=(guess.value||"").trim().toLowerCase(); fb.textContent=g===current?"✅ Correct!":"❌ Try again.";}
    document.getElementById('check').onclick=check;
    document.getElementById('shuffle').onclick=()=>{ if(current) scr.textContent=shuffleLetters(current); };
    document.getElementById('hint').onclick=()=>{ if(current) fb.textContent=`Hint: starts with “${current[0].toUpperCase()}”`; };
    document.getElementById('next').onclick=loadToday;
    guess.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });

    loadToday();
  </script>
</body>
</html>
