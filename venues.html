<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WY3H0WSHS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0WY3H0WSHS');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venue Leaderboard · Ben's Trivia</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <style>
    .global-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 120;
      padding: 10px 14px 12px;
      background: linear-gradient(90deg, #020713ee, #041831ee);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(150, 208, 255, 0.3);
    }
    .header-row-top { display: flex; align-items: center; justify-content: space-between; position: relative; }
    .header-logo { height: 52px; width: auto; filter: drop-shadow(0 0 8px var(--neon)) drop-shadow(0 0 18px var(--neon-soft)); }
    .header-row-bottom { margin-top: 6px; text-align: center; }
    .page-title { margin: 0; font-size: 1.1rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); text-shadow: 0 0 8px var(--neon-soft); }
    .global-header #menu-btn {
      background: rgba(0,0,0,.25); border: 1.5px solid var(--neon); color: var(--neon);
      font-size: 1.3rem; padding: 6px 12px; border-radius: 12px; cursor: pointer;
      box-shadow: 0 0 10px var(--neon-soft); transition: .18s;
    }
    .global-header #menu-btn:hover { background: var(--neon); color: #001; }
    .menu-dropdown {
      position: absolute; top: 60px; left: 8px; background: var(--bg2);
      border: 1px solid var(--neon); border-radius: 12px; padding: 6px;
      box-shadow: 0 0 18px var(--neon-soft); min-width: 210px;
      display: none; flex-direction: column; z-index: 200;
    }
    .menu-dropdown a { display: block; padding: 10px 12px; color: var(--text); text-decoration: none; border-radius: 10px; font-size: 0.95rem; white-space: nowrap; }
    .menu-dropdown a:hover { background: var(--neon); color: #001; }

    body { padding-top: 130px; }
    main { display: grid; place-items: center; padding: 24px 16px 48px; }
    .stats-shell { width: min(960px, 100%); display: flex; flex-direction: column; gap: 20px; }

    .card { background: var(--bg2); border: 1px solid rgba(150,208,255,0.2); border-radius: 16px; padding: 18px 16px; }
    .section-heading {
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--neon-soft); opacity: 0.8;
      margin: 0 0 10px;
    }
    .loading-msg { text-align: center; opacity: 0.5; padding: 24px; font-size: 0.9rem; }

    .lb-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .lb-table th { text-align: left; padding: 6px 10px; color: var(--neon-soft); opacity: 0.7; font-weight: 500; border-bottom: 1px solid rgba(150,208,255,0.15); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .lb-table td { padding: 9px 10px; border-bottom: 1px solid rgba(150,208,255,0.07); }
    .lb-table tr:nth-child(1) td { color: #ffd700; }
    .lb-table tr:nth-child(2) td { color: #c0d8e8; }
    .lb-table tr:nth-child(3) td { color: #e8b87a; }

    .venue-select-wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .venue-select-wrap label { font-size: 0.85rem; opacity: 0.7; }
    select.venue-picker {
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid rgba(150,208,255,0.6); background: rgba(0,8,18,0.85);
      color: #e9f4ff; font-size: 0.9rem; cursor: pointer; flex: 1;
    }

    .month-label { text-align: center; font-size: 0.8rem; opacity: 0.6; margin-top: -8px; }
    .global-footer { text-align: center; padding: 12px 8px 20px; font-size: 0.85rem; color: var(--neon-soft); opacity: 0.9; }
  </style>
</head>
<body>
  <header class="global-header">
    <div class="header-row-top">
      <button id="menu-btn" aria-label="Open menu">☰</button>
      <picture>
        <source srcset="images/logo.webp" type="image/webp">
        <img src="images/logo.png" class="header-logo" alt="Ben's Trivia Logo" width="147" height="52" fetchpriority="high" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      </picture>
      <div style="width:52px;"></div>
    </div>
    <div class="header-row-bottom">
      <h1 class="page-title">🏟️ Venue Stats</h1>
    </div>
    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="/">🍻 Big Fat Sunday Quiz</a>
      <a href="stats.html">📊 Quiz Stats</a>
      <a href="venues.html" id="venue-stats-link" style="display:none;">🏟️ Venue Stats</a>
      <a href="countries.html" id="country-stats-link" style="display:none;">🌍 Country Leaderboard</a>
    </nav>
  </header>

  <main>
    <div class="stats-shell">

      <div class="month-label" id="month-label">—</div>

      <div class="card">
        <h2 class="section-heading">🏆 Venue Leaderboard</h2>
        <table class="lb-table">
          <thead>
            <tr><th>#</th><th>Venue</th><th>Avg %</th></tr>
          </thead>
          <tbody id="venue-lb-body">
            <tr><td colspan="3" class="loading-msg">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card">
        <h2 class="section-heading">Top 10 Players by Venue</h2>
        <div class="venue-select-wrap" style="margin-bottom:14px;">
          <label for="venue-picker">Showing players at:</label>
          <select class="venue-picker" id="venue-picker">
            <option value="">Loading venues…</option>
          </select>
        </div>
        <table class="lb-table">
          <thead>
            <tr><th>#</th><th>Flag</th><th>Name</th><th>Score</th><th>%</th></tr>
          </thead>
          <tbody id="venue-players-body">
            <tr><td colspan="5" class="loading-msg">Select a venue above</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <footer class="global-footer">Made by Ben · Venue Stats</footer>

<script>
const SUPA_URL = "https://cxgndxmvyerwejwyitrf.supabase.co";
const SUPA_KEY = "sb_publishable_LMgLiRKeCPREBMa9r-pEOQ_et-2xo0L";

// Only count results from this moment onwards (midnight, 1 October 2026, Brisbane time)
const LEADERBOARD_START = "2026-10-01T00:00:00+10:00";
const LEADERBOARD_START_LABEL = "1 October 2026";
// Columns the leaderboard table might use for when a score was submitted (first one that exists is used)
const DATE_COLUMN_CANDIDATES = ["submitted_at", "created_at"];
let dateColumn = null;

async function detectDateColumn() {
  for (const col of DATE_COLUMN_CANDIDATES) {
    try {
      const res = await fetch(`${SUPA_URL}/rest/v1/leaderboard?select=${col}&limit=1`, {
        headers: { "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}` }
      });
      if (res.ok) return col;
    } catch {}
  }
  return null;
}
// Where the quiz page remembers the venue the player just played at
const VENUE_STORAGE_KEY = "bens-trivia-venue";

function sinceFilter() {
  if (!dateColumn) throw new Error("No date column found on leaderboard table");
  return `${dateColumn}=gte.${encodeURIComponent(new Date(LEADERBOARD_START).toISOString())}`;
}

const DEV_MODE_KEY = "bens-trivia-dev-mode";
if (location.search.includes("nodev")) {
  sessionStorage.removeItem(DEV_MODE_KEY);
} else {
  if (location.search.includes("dev")) sessionStorage.setItem(DEV_MODE_KEY, "1");
  if (sessionStorage.getItem(DEV_MODE_KEY) === "1") {
    document.getElementById("venue-stats-link").style.display = "block";
    document.getElementById("country-stats-link").style.display = "block";
  }
}

const menuBtn = document.getElementById("menu-btn");
const menuDropdown = document.getElementById("menu-dropdown");
menuBtn.addEventListener("click", () => {
  menuDropdown.style.display = menuDropdown.style.display === "flex" ? "none" : "flex";
});
document.addEventListener("click", e => {
  if (!menuDropdown.contains(e.target) && !menuBtn.contains(e.target))
    menuDropdown.style.display = "none";
});

function countryFlag(code) {
  if (!code || code.length !== 2) return "";
  return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) + " ";
}
function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// Venues that need special capitalisation
const VENUE_NAMES = { "xxxx-brewery": "XXXX Brewery" };
function prettyVenueName(slug) {
  return VENUE_NAMES[slug] || slug.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function slugify(str) {
  return String(str || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

document.getElementById("month-label").textContent = `Results from ${LEADERBOARD_START_LABEL} onwards`;

// The venue the player just played at: ?venue= in this page's link,
// then whatever the quiz page saved in the browser, else nothing.
function getPlayedVenue() {
  try {
    const fromUrl = new URLSearchParams(location.search).get("venue");
    if (fromUrl) return slugify(fromUrl);
  } catch {}
  for (const store of [localStorage, sessionStorage]) {
    try {
      const direct = store.getItem(VENUE_STORAGE_KEY);
      if (direct) return slugify(direct);
      for (let i = 0; i < store.length; i++) {
        const key = store.key(i);
        if (/venue/i.test(key) && !/dev-mode/i.test(key)) {
          const val = store.getItem(key);
          if (val && val.length < 80) return slugify(val);
        }
      }
    } catch {}
  }
  return "";
}

(async function init() {
  dateColumn = await detectDateColumn();
  const venues = await fetchVenueLeaderboard();
  renderVenueLeaderboard(venues);
  populateVenuePicker(venues);
})();

async function fetchAllRows(query) {
  const pageSize = 1000;
  let allRows = [];
  let from = 0;
  while (true) {
    const url = `${SUPA_URL}/rest/v1/leaderboard?${query}`;
    const res = await fetch(url, {
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": `Bearer ${SUPA_KEY}`,
        "Range": `${from}-${from + pageSize - 1}`
      }
    });
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) break;
    allRows = allRows.concat(rows);
    if (rows.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

async function fetchVenueLeaderboard() {
  try {
    const rows = await fetchAllRows(`select=venue,percent&venue=not.is.null&${sinceFilter()}`);
    const byVenue = {};
    rows.forEach(r => {
      if (!r.venue) return;
      if (!byVenue[r.venue]) byVenue[r.venue] = { total: 0, count: 0 };
      byVenue[r.venue].total += r.percent;
      byVenue[r.venue].count += 1;
    });
    const venues = Object.keys(byVenue).map(venue => ({
      venue,
      avg_percent: Math.round((byVenue[venue].total / byVenue[venue].count) * 10) / 10
    }));
    venues.sort((a, b) => b.avg_percent - a.avg_percent);
    return venues;
  } catch { return []; }
}

function renderVenueLeaderboard(venues) {
  const tbody = document.getElementById("venue-lb-body");
  if (!venues || !venues.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="loading-msg">No venue scores yet</td></tr>';
    return;
  }
  const medals = ["🥇","🥈","🥉"];
  tbody.innerHTML = venues.map((v, i) => `
    <tr>
      <td>${medals[i] || (i + 1)}</td>
      <td>${escapeHtml(prettyVenueName(v.venue))}</td>
      <td>${v.avg_percent}%</td>
    </tr>
  `).join("");
}

function populateVenuePicker(venues) {
  const picker = document.getElementById("venue-picker");
  if (!venues || !venues.length) {
    picker.innerHTML = '<option value="">No venues yet</option>';
    return;
  }
  picker.innerHTML = '<option value="">— Select a venue —</option>'
    + venues.map(v => `<option value="${escapeHtml(v.venue)}">${escapeHtml(prettyVenueName(v.venue))}</option>`).join("");
  picker.addEventListener("change", () => {
    if (picker.value) loadVenuePlayers(picker.value);
  });

  // Default to the venue they just played at; leave blank if we can't tell
  const played = getPlayedVenue();
  const match = venues.find(v => slugify(v.venue) === played);
  if (match) {
    picker.value = match.venue;
    loadVenuePlayers(match.venue);
  }
}

async function loadVenuePlayers(venue) {
  const tbody = document.getElementById("venue-players-body");
  tbody.innerHTML = '<tr><td colspan="5" class="loading-msg">Loading…</td></tr>';
  try {
    const rows = await fetchAllRows(
      `venue=eq.${encodeURIComponent(venue)}`
      + `&${sinceFilter()}`
      + `&select=player_name,score,max_score,percent,country`
      + `&order=score.desc,percent.desc`
    );

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="loading-msg">No players yet</td></tr>';
      return;
    }

    let ranks = []; let currentRank = 0;
    rows.forEach((r, i) => {
      if (i === 0 || r.score !== rows[i-1].score || r.percent !== rows[i-1].percent) currentRank = i;
      ranks.push(currentRank);
    });
    const medals = ["🥇","🥈","🥉"];

    tbody.innerHTML = rows.slice(0, 10).map((r, i) => {
      const rank = ranks[i];
      const medal = medals[rank];
      const suffix = (rank+1) === 1 ? "st" : (rank+1) === 2 ? "nd" : (rank+1) === 3 ? "rd" : "th";
      const rankDisplay = medal || `${rank+1}${suffix}`;
      return `
        <tr>
          <td>${rankDisplay}</td>
          <td style="font-size:1.1rem;">${countryFlag(r.country)}</td>
          <td>${escapeHtml(r.player_name)}</td>
          <td>${r.score} / ${r.max_score}</td>
          <td>${r.percent}%</td>
        </tr>`;
    }).join("");
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5" class="loading-msg">Could not load players.</td></tr>';
  }
}
</script>
</body>
</html>
