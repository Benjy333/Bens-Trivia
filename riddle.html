<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ben's Trivia — Riddles</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-card{width:min(640px,92vw)}
    .riddle{font-size:clamp(18px,2.8vw,22px);line-height:1.55;text-align:center;margin:6px 0 14px}
    .controls{display:grid;grid-template-columns:1fr auto;gap:10px}
    .toolbar{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
    .feedback{min-height:28px;text-align:center;margin-top:8px}
  </style>
</head>
<body>
  <header class="top-menu">
    <button id="menu-btn">☰</button>
    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Ben's Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
      <a href="connections.html">🧩 Connections</a>
    </nav>
  </header>
<div class="logo-wrap">
  <img class="logo-img" src="logo.png" alt="Ben's Trivia logo" />
</div>

  <main class="wrap">
    <section class="game-card card">
      <div class="riddle" id="riddle">Loading…</div>
      <div class="controls">
        <input id="guess" type="text" placeholder="Your answer…" autocomplete="off"/>
        <button class="btn" id="check">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="toolbar">
        <button class="btn" id="reveal">Reveal</button>
        <button class="btn" id="next">New riddle</button>
      </div>
    </section>
  </main>

  <footer id="footerText"></footer>

  <script>
    // Menu + footer
    const mb=document.getElementById('menu-btn'), md=document.getElementById('menu-dropdown');
    mb.onclick=()=>md.style.display=md.style.display==='block'?'none':'block';
    document.addEventListener('click',e=>{if(!mb.contains(e.target)&&!md.contains(e.target))md.style.display='none'});
    const today=new Date();document.getElementById('footerText').textContent=`Made by Ben · Puzzle No. 1 · ${today.toLocaleDateString(undefined,{weekday:'long'})}, ${today.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`;

    // Game
    const rid=document.getElementById('riddle'), guess=document.getElementById('guess'), fb=document.getElementById('feedback');
    let answer="";
    async function loadToday(){
      const data=await (await fetch('daily_content.json')).json();
      const start=new Date(data.start_date);
      const idx=Math.min(Math.floor((Date.now()-start)/86400000), data.riddles.length-1);
      const R=data.riddles[idx];
      rid.textContent=R.q; answer=(R.a||"").toLowerCase().replace(/[^a-z]/g,''); fb.textContent=""; guess.value=""; guess.focus();
    }
    function norm(s){return (s||"").trim().toLowerCase().replace(/[^a-z]/g,'');}
    document.getElementById('check').onclick=()=>{const g=norm(guess.value); if(!g) return; fb.textContent=g===answer?"✅ Correct!":"❌ Not quite. Try reveal or guess again.";};
    document.getElementById('reveal').onclick=()=>{fb.innerHTML=`🗝️ Answer: <strong>${answer}</strong>`;};
    document.getElementById('next').onclick=loadToday;
    guess.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('check').click(); });

    loadToday();
  </script>
</body>
</html>
