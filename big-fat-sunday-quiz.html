<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Big Fat Sunday Quiz</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== HEADER (shared feel with other games) ===== */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      padding: 10px 14px 12px;
      background: linear-gradient(90deg, #020713ee, #041831ee);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(150, 208, 255, 0.3);
    }
    .header-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      height: 52px;
      width: auto;
      filter:
        drop-shadow(0 0 8px var(--neon))
        drop-shadow(0 0 18px var(--neon-soft));
    }
    .header-row-bottom {
      margin-top: 6px;
      text-align: center;
    }
    .page-title {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .page-date {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .howto-icon {
      display: none;
    }

    .global-header #menu-btn {
      background: rgba(0,0,0,.25);
      border: 1.5px solid var(--neon);
      color: var(--neon);
      font-size: 1.3rem;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-soft);
      transition: .18s;
    }
    .global-header #menu-btn:hover {
      background: var(--neon);
      color: #001;
    }

    .menu-dropdown {
      position: absolute;
      top: 60px;
      left: 8px;
      background: var(--bg2);
      border: 1px solid var(--neon);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 0 18px var(--neon-soft);
      min-width: 210px;
      display: none;
      flex-direction: column;
      z-index: 200;
    }
    .menu-dropdown a {
      display: block;
      padding: 10px 12px;
      color: var(--text);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .menu-dropdown a:hover {
      background: var(--neon);
      color: #001;
    }

    body {
      padding-top: 140px;
    }
    main {
      display: grid;
      place-items: center;
      padding: 24px 16px 48px;
    }

    .quiz-shell {
      width: min(960px, 100%);
    }
    .page-subtitle {
      text-align: center;
      margin: 0 0 8px;
      font-size: 1rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .quiz-meta {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 14px;
      opacity: 0.9;
    }
    .quiz-meta strong {
      color: var(--neon-soft);
    }

    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .question-card {
      background: radial-gradient(circle at top left, #12335a 0, #020a16 55%);
      border-radius: 16px;
      padding: 14px 14px 10px;
      border: 1px solid rgba(150, 208, 255, 0.35);
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.6),
        0 0 18px rgba(55, 161, 255, 0.22);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 12px;
    }
    .question-number {
      font-size: 0.82rem;
      opacity: 0.85;
    }
    .question-text {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .question-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }

    .options {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 640px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
    .option-label {
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.3);
      padding: 7px 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: rgba(3, 15, 34, 0.8);
      transition: 0.06s ease-out;
    }
    .option-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(55, 161, 255, 0.45);
      border-color: var(--neon-soft);
    }
    .option-label input { accent-color: var(--neon); }
    .option-label.correct {
      border-color: var(--good);
      box-shadow: 0 0 14px rgba(56, 239, 125, 0.7);
    }
    .option-label.chosen-wrong {
      border-color: var(--bad);
      box-shadow: 0 0 14px rgba(255, 66, 102, 0.7);
    }

    .btn-question {
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.7);
      background: rgba(3, 15, 34, 0.95);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .feedback {
      margin-top: 6px;
      font-size: 0.82rem;
      min-height: 16px;
    }
    .feedback.correct { color: var(--good); }
    .feedback.incorrect { color: var(--bad); }

    .small-hint {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .question-input {
      margin-top: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(0, 8, 18, 0.85);
      color: #e9f4ff;
      font-size: 0.9rem;
    }

    .image-wrap {
      margin-top: 10px;
      text-align: center;
    }
    .image-wrap img {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(150, 208, 255, 0.4);
    }

    /* Drag-and-drop sort list */
    .sort-list {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
    }
    .sort-item {
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.4);
      background: rgba(3, 15, 34, 0.9);
      margin-bottom: 6px;
      cursor: grab;
      font-size: 0.9rem;
    }
    .sort-item.dragging {
      opacity: 0.7;
      border-style: dashed;
    }

    /* List self-score input */
    .manual-score-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .manual-score-wrap input {
      width: 60px;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(0, 8, 18, 0.85);
      color: #e9f4ff;
      font-size: 0.85rem;
    }

    /* Progress, score, share */
    .progress-wrap {
      max-width: 480px;
      margin: 0 auto 10px;
      text-align: left;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .progress-label {
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .progress-bar-outer {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(4, 20, 40, 0.9);
      border: 1px solid rgba(150, 208, 255, 0.5);
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--neon-soft), var(--good));
      box-shadow:
        0 0 14px rgba(55, 161, 255, 0.7),
        0 0 24px rgba(56, 239, 125, 0.7);
      transition: width 0.15s ease-out;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(3, 15, 34, 0.9);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary:active { transform: translateY(1px); }

    .score-box {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
    }
    .score-box .percent {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--neon-soft);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .score-box .raw {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .share-panel {
      margin-top: 12px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .global-footer {
      text-align: center;
      padding: 12px 8px 20px;
      font-size: 0.85rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .header-logo { height: 44px; }
      .page-title { font-size: 0.95rem; }
      .quiz-shell { padding: 18px 14px; }
    }
  </style>
</head>

<body>
  <!-- UNIVERSAL HEADER -->
  <header class="global-header">
    <div class="header-row-top">
      <div class="header-left">
        <button id="menu-btn">☰</button>
        <img src="logo.png" class="header-logo" alt="Ben's Trivia Logo">
      </div>
      <div class="howto-icon" id="howto-icon" style="display:none;">?</div>
    </div>

    <div class="header-row-bottom">
      <h1 class="page-title">The Big Fat Sunday Quiz</h1>
      <span class="page-date" id="page-date"></span>
    </div>

    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Daily Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
      <a href="connections.html">🧩 Connections</a>
      <a href="big-fat-sunday-quiz.html">🍻 Big Fat Sunday Quiz</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <main>
    <section class="game-card card quiz-shell">
      <p class="page-subtitle">25 questions. One big quiz.</p>

      <div id="quiz-meta" class="quiz-meta">
        <strong id="quiz-title">General Knowledge – Big Fat Sunday Quiz</strong><br>
        <span id="quiz-week-info">25 questions · Mixed formats · Auto-scored + self-scored specials</span>
      </div>

      <div class="quiz-container" id="quiz-container"></div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-text">0 / 25 questions checked</span>
        </div>
        <div class="progress-bar-outer">
          <div id="progress-bar" class="progress-bar-inner"></div>
        </div>
      </div>

      <button class="btn-secondary" id="jump-unanswered">
        Show first unanswered question
      </button>

      <div class="score-box" id="score-box"></div>

      <div class="share-panel" id="share-panel" style="display:none;">
        <div class="share-buttons">
          <button class="btn-secondary" id="share-whatsapp">Share via WhatsApp</button>
          <button class="btn-secondary" id="copy-result">Copy result</button>
        </div>
        <div id="share-status" style="font-size:11px; opacity:0.8; margin-top:6px;"></div>
      </div>
    </section>
  </main>

  <footer class="global-footer" id="footer-text"></footer>

  <script>
    // HEADER DATE + FOOTER
    (function setHeaderAndFooter() {
      const today = new Date();
      document.getElementById("page-date").textContent = today.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
      document.getElementById("footer-text").textContent = "Made by Ben · " + today.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    })();

    // MENU
    const menuBtn = document.getElementById("menu-btn");
    const menuDropdown = document.getElementById("menu-dropdown");
    menuBtn.addEventListener("click", () => {
      const isOpen = menuDropdown.style.display === "flex";
      menuDropdown.style.display = isOpen ? "none" : "flex";
    });
    document.addEventListener("click", (e) => {
      if (!menuDropdown.contains(e.target) && !menuBtn.contains(e.target)) {
        menuDropdown.style.display = "none";
      }
    });

    // ------------- QUESTION DATA (25 total) -------------
    const questions = [

            // MS PAINT MOVIE POSTER – generic self-mark
      {
        id: "ms-paint-poster",
        type: "self-text-image",
        tag: "MS Paint poster",
        text: "Microsoft Paint movie poster: which film is this?",
        image: "film.png",
        answerText: "The Matrix",
        maxPoints: 1
      },
      // LIST: planets with rings – manual score
      {
        id: "rings-list",
        type: "list-manual",
        tag: "List question",
        text: "Name each planet with rings.",
        answerText: ["Saturn", "Jupiter", "Uranus", "Neptune"],
        maxPoints: 4,
      },
      // MCQ
      {
        id: "language-native",
        type: "mcq",
        tag: "Multiple choice",
        text: "Which language has the most native speakers?",
        options: ["English", "Spanish", "Mandarin Chinese", "Hindi"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        id: "smallest-prime",
        type: "mcq",
        tag: "Multiple choice",
        text: "What is the smallest prime number?",
        options: ["0", "1", "2", "3"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        id: "cant-handle-truth",
        type: "mcq",
        tag: "Movies",
        text: "Which film features the line “You can’t handle the truth!”?",
        options: ["A Few Good Men", "Top Gun", "Die Hard", "The Godfather"],
        correctIndex: 0,
        maxPoints: 1
      },
      // MORPHED CELEB – self mark
      {
        id: "morphed-celeb",
        type: "self-text-image",
        tag: "Morphed celebrity",
        text: "Morphed celebrity (picture shown). Who are the two actors?",
        image: "morph.png", // you can change this
        answerText: "John Travolta and Tom Cruise",
        maxPoints: 2
      },
      // MCQ
      {
        id: "thor-hammer",
        type: "mcq",
        tag: "Multiple choice",
        text: "In the Marvel films, what is Thor’s hammer called?",
        options: ["Gungnir", "Stormbreaker", "Mjolnir", "Aegis"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        id: "main-gas-1",
        type: "mcq",
        tag: "Multiple choice",
        text: "What is the main gas found in the air we breathe?",
        options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"],
        correctIndex: 2,
        maxPoints: 1
      },
      // ANAGRAM
      {
        id: "anagram-platypus",
        type: "text-exact",
        tag: "Anagram",
        text: "Anagram: Rearrange the following word - uplytpas    Hint: it’s an animal?",
        correctAnswer: "platypus",
        maxPoints: 1
      },
      // LARGEST INTERNAL ORGAN
      {
        id: "largest-organ",
        type: "mcq",
        tag: "Multiple choice",
        text: "What is the largest internal organ in the human body?",
        options: ["Heart", "Liver", "Lungs", "Kidneys"],
        correctIndex: 1,
        maxPoints: 1
      },
      // SPHYGMOMANOMETER
      {
        id: "sphygmo",
        type: "mcq",
        tag: "Multiple choice",
        text: "What does a sphygmomanometer measure?",
        options: ["Blood sugar", "Blood pressure", "Lung capacity", "Heart rate"],
        correctIndex: 1,
        maxPoints: 1
      },
      // SHAKESPEARE LONGEST PLAY
      {
        id: "shakespeare-longest",
        type: "mcq",
        tag: "Multiple choice",
        text: "Which is Shakespeare’s longest play?",
        options: ["Macbeth", "Othello", "Hamlet", "King Lear"],
        correctIndex: 2,
        maxPoints: 1
      },
      // GUESS THE CREDITS – self mark
      {
        id: "guess-credits",
        type: "self-text-image",
        tag: "Guess the credits",
        text: "Guess the movie from the credits screenshot.",
        image: "credits.png", // change this to your actual image
        answerText: "Rain Man",
        maxPoints: 1
      },
      // SORT THE BOOKS – drag & drop
      {
        id: "sort-books",
        type: "sort",
        tag: "Sort the order",
        text: "Sort these books by number of words, from least to most.",
        items: [
          { id: "lotr", label: "Lord of the Rings" },
          { id: "hp", label: "Harry Potter" },
          { id: "kjb", label: "King James Bible" }
        ],
        correctOrder: ["lotr", "hp", "kjb"], /* as you specified */
        maxPoints: 1
      },
      // FLAG QUESTION – self mark
      {
        id: "flag-country",
        type: "self-text-image",
        tag: "Flag question",
        text: "What country does this flag belong to?",
        image: "flag.png",
        answerText: "Singapore",
        maxPoints: 1
      },
      // WORLD CUP WINS
      {
        id: "world-cups",
        type: "mcq",
        tag: "Multiple choice",
        text: "Which country has won the most FIFA World Cups (men’s)?",
        options: ["Germany", "Italy", "Argentina", "Brazil"],
        correctIndex: 3,
        maxPoints: 1
      },
      // DUPLICATE GAS QUESTION – as in sheet
      {
        id: "main-gas-2",
        type: "mcq",
        tag: "Multiple choice",
        text: "Again: what is the main gas found in the air we breathe?",
        options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"],
        correctIndex: 2,
        maxPoints: 1
      },
      // MACHU PICCHU
      {
        id: "machu-picchu",
        type: "mcq",
        tag: "Multiple choice",
        text: "Which country is famous for the landmark Machu Picchu?",
        options: ["Peru", "Chile", "Mexico", "Guatemala"],
        correctIndex: 0,
        maxPoints: 1
      },
      // GUESS THE YEAR
      {
        id: "toy-story-year",
        type: "year",
        tag: "Guess the year",
        text: "In what year did Toy Story 2 release and Chappelle Roan born?",
        correctYear: 1998,
        maxPoints: 2
      },
      // MATHS PUZZLE
      {
        id: "clock-right-angles",
        type: "numeric",
        tag: "Maths puzzle",
        text: "If there are 5 people at a party, and everyone has a handshake, how many handshakes will there be?",
        correctNumber: 10,
        maxPoints: 1
      },
      // NEXT OLYMPICS – silly US place
      {
        id: "next-olympics",
        type: "mcq",
        tag: "Silly US place",
        text: "Which city will host the next Olympic Games (Summer)?",
        options: ["Tokyo", "Brisbane", "Barcelona", "Los Angeles"],
        correctIndex: 3,
        maxPoints: 1
      },
      // TENNIS 40-40
      {
        id: "tennis-40",
        type: "mcq",
        tag: "Multiple choice",
        text: "In tennis, what is the score when both players have 40?",
        options: ["Deuce", "Love", "Advantage", "Tie"],
        correctIndex: 0,
        maxPoints: 1
      },
      // OLYMPIC RING COLOURS
      {
        id: "ring-colour",
        type: "mcq",
        tag: "Multiple choice",
        text: "Which of these is NOT a colour on the Olympic rings?",
        options: ["Black", "White", "Green", "Yellow"],
        correctIndex: 1,
        maxPoints: 1
      },
      // MAXIMUM BREAK
      {
        id: "snooker-break",
        type: "mcq",
        tag: "Multiple choice",
        text: "What is the maximum break in snooker?",
        options: ["147", "155", "167", "180"],
        correctIndex: 0,
        maxPoints: 1
      },
      // NOT AN OLYMPIC EVENT – topical
      {
        id: "not-olympic",
        type: "mcq",
        tag: "Topical / Odd one out",
        text: "Which one of these was NOT an Olympic event?",
        options: [
          "Blind archery",
          "Solo Synchronized Swimming",
          "Hot Air Ballooning",
          "Live pigeon shooting"
        ],
        correctIndex: 0,
        maxPoints: 1
      }

    ];

    // ------------- STATE -------------
    const questionStates = questions.map(q => ({
      checked: false,
      points: 0,
      maxPoints: q.maxPoints
    }));

    const quizContainer = document.getElementById("quiz-container");
    const scoreBox = document.getElementById("score-box");
    const sharePanel = document.getElementById("share-panel");
    const shareStatus = document.getElementById("share-status");
    const progressTextEl = document.getElementById("progress-text");
    const progressBarEl = document.getElementById("progress-bar");
    const jumpUnansweredBtn = document.getElementById("jump-unanswered");

    const TOTAL_QUESTIONS = questions.length;
    const MAX_POINTS = questionStates.reduce((sum, s) => sum + s.maxPoints, 0);

    // ------------- RENDERING -------------
    function renderQuiz() {
      quizContainer.innerHTML = "";
      questions.forEach((q, index) => {
        const card = document.createElement("article");
        card.className = "question-card";
        card.id = `card-${index}`;

        const header = document.createElement("div");
        header.className = "question-header";

        const qNumber = document.createElement("div");
        qNumber.className = "question-number";
        qNumber.textContent = `Question ${index + 1}`;

        const qText = document.createElement("div");
        qText.className = "question-text";
        qText.textContent = q.text;

        header.appendChild(qNumber);
        header.appendChild(qText);

        if (q.tag) {
          const tag = document.createElement("div");
          tag.className = "question-tag";
          tag.textContent = q.tag;
          header.appendChild(tag);
        }

        card.appendChild(header);

        // type-specific UI
        if (q.type === "mcq") {
          const optionsWrap = document.createElement("div");
          optionsWrap.className = "options";
          q.options.forEach((optText, optIndex) => {
            const id = `q${index}_opt${optIndex}`;
            const label = document.createElement("label");
            label.className = "option-label";
            label.setAttribute("for", id);
            label.dataset.q = index;
            label.dataset.opt = optIndex;

            const input = document.createElement("input");
            input.type = "radio";
            input.name = `q${index}`;
            input.id = id;
            input.value = optIndex;

            const span = document.createElement("span");
            span.textContent = optText;

            label.appendChild(input);
            label.appendChild(span);
            optionsWrap.appendChild(label);
          });
          card.appendChild(optionsWrap);
        } else if (q.type === "text-exact" || q.type === "numeric" || q.type === "year") {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "question-input";
          input.id = `input-${index}`;
          input.placeholder = (q.type === "year" || q.type === "numeric") ? "Enter a number…" : "Type your answer…";
          card.appendChild(input);
        } else if (q.type === "self-text-image") {
          if (q.image) {
            const imgWrap = document.createElement("div");
            imgWrap.className = "image-wrap";
            const img = document.createElement("img");
            img.src = q.image;
            img.alt = "Question image";
            imgWrap.appendChild(img);
            card.appendChild(imgWrap);
          }
          const input = document.createElement("input");
          input.type = "text";
          input.className = "question-input";
          input.id = `input-${index}`;
          input.placeholder = "Type your guess (you'll self-mark)…";
          card.appendChild(input);
          const hint = document.createElement("div");
          hint.className = "small-hint";
          hint.textContent = "Tap 'Reveal answer' then choose if you were correct.";
          card.appendChild(hint);
        } else if (q.type === "list-manual") {
          const hint = document.createElement("div");
          hint.className = "small-hint";
          hint.textContent = "Write your answers on paper or in your head. Reveal the list, then enter how many you got right (1 point per planet).";
          card.appendChild(hint);
        } else if (q.type === "sort") {
          const list = document.createElement("ul");
          list.className = "sort-list";
          list.id = `sort-${index}`;
          q.items.forEach(item => {
            const li = document.createElement("li");
            li.className = "sort-item";
            li.textContent = item.label;
            li.draggable = true;
            li.dataset.value = item.id;
            list.appendChild(li);
          });
          card.appendChild(list);
          enableDragAndDrop(list);
        }

        if (q.type === "self-text-image" || q.type === "list-manual") {
          // self-marking style button(s)
          const revealBtn = document.createElement("button");
          revealBtn.className = "btn-question";
          revealBtn.type = "button";
          revealBtn.textContent = "Reveal answer";
          revealBtn.addEventListener("click", () => revealSelfMarked(index));
          card.appendChild(revealBtn);
        } else if (q.type === "sort") {
          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check order";
          checkBtn.addEventListener("click", () => checkSortQuestion(index));
          card.appendChild(checkBtn);
        } else {
          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check answer";
          checkBtn.addEventListener("click", () => checkStandardQuestion(index));
          card.appendChild(checkBtn);
        }

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.id = `feedback-${index}`;
        card.appendChild(feedback);

        // for self-mark or list manual we add controls below feedback
        if (q.type === "self-text-image") {
          const selfButtons = document.createElement("div");
          selfButtons.className = "manual-score-wrap";
          const correctBtn = document.createElement("button");
          correctBtn.type = "button";
          correctBtn.className = "btn-secondary";
          correctBtn.textContent = "I got it right";
          correctBtn.addEventListener("click", () => {
            questionStates[index].checked = true;
            questionStates[index].points = q.maxPoints;
            feedback.textContent = `Nice! You’ve given yourself ${q.maxPoints} point${q.maxPoints !== 1 ? "s" : ""}.`;
            feedback.classList.remove("incorrect");
            feedback.classList.add("correct");
            updateScoreAndProgress();
          });
          const wrongBtn = document.createElement("button");
          wrongBtn.type = "button";
          wrongBtn.className = "btn-secondary";
          wrongBtn.textContent = "I got it wrong";
          wrongBtn.addEventListener("click", () => {
            questionStates[index].checked = true;
            questionStates[index].points = 0;
            feedback.textContent = "Marked as 0 points.";
            feedback.classList.remove("correct");
            feedback.classList.add("incorrect");
            updateScoreAndProgress();
          });
          selfButtons.appendChild(correctBtn);
          selfButtons.appendChild(wrongBtn);
          card.appendChild(selfButtons);
        } else if (q.type === "list-manual") {
          const manual = document.createElement("div");
          manual.className = "manual-score-wrap";
          manual.innerHTML = `
            <span>How many did you get right?</span>
            <input type="number" min="0" max="${q.maxPoints}" id="manual-${index}" value="0" />
            <button type="button" class="btn-secondary">Save score</button>
          `;
          const btn = manual.querySelector("button");
          btn.addEventListener("click", () => {
            const inputEl = manual.querySelector("input");
            let val = parseInt(inputEl.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            if (val > q.maxPoints) val = q.maxPoints;
            inputEl.value = val;
            questionStates[index].checked = true;
            questionStates[index].points = val;
            feedback.textContent = `Saved ${val} point${val !== 1 ? "s" : ""} for this question.`;
            feedback.classList.remove("incorrect");
            feedback.classList.add("correct");
            updateScoreAndProgress();
          });
          card.appendChild(manual);
        }

        quizContainer.appendChild(card);
      });
    }

    // drag-and-drop helper
    function enableDragAndDrop(listEl) {
      let draggedItem = null;
      listEl.addEventListener("dragstart", (e) => {
        if (e.target.classList.contains("sort-item")) {
          draggedItem = e.target;
          e.target.classList.add("dragging");
        }
      });
      listEl.addEventListener("dragend", (e) => {
        if (draggedItem) {
          draggedItem.classList.remove("dragging");
          draggedItem = null;
        }
      });
      listEl.addEventListener("dragover", (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(listEl, e.clientY);
        if (!draggedItem) return;
        if (afterElement == null) {
          listEl.appendChild(draggedItem);
        } else {
          listEl.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll(".sort-item:not(.dragging)")];
      let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
      draggableElements.forEach(child => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          closest = { offset, element: child };
        }
      });
      return closest.element;
    }

    renderQuiz();

    // ------------- CHECKING LOGIC -------------
    function checkStandardQuestion(index) {
      const q = questions[index];
      const feedback = document.getElementById(`feedback-${index}`);
      feedback.classList.remove("correct", "incorrect");

      if (q.type === "mcq") {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const labels = document.querySelectorAll(`label.option-label[data-q="${index}"]`);
        labels.forEach(l => l.classList.remove("correct", "chosen-wrong"));

        if (!selected) {
          feedback.textContent = "Choose an answer first 😊";
          return;
        }
        const chosen = Number(selected.value);
        const correct = q.correctIndex;

        labels.forEach(label => {
          const opt = Number(label.dataset.opt);
          if (opt === correct) {
            label.classList.add("correct");
          } else if (opt === chosen && chosen !== correct) {
            label.classList.add("chosen-wrong");
          }
        });

        if (chosen === correct) {
          feedback.textContent = "Correct! 🎉";
          feedback.classList.add("correct");
          questionStates[index].points = q.maxPoints;
        } else {
          feedback.textContent = `Incorrect – correct answer: ${q.options[correct]}`;
          feedback.classList.add("incorrect");
          questionStates[index].points = 0;
        }
        questionStates[index].checked = true;
      } else if (q.type === "text-exact") {
        const input = document.getElementById(`input-${index}`);
        const user = (input.value || "").trim().toLowerCase();
        const correct = (q.correctAnswer || "").trim().toLowerCase();
        if (!user) {
          feedback.textContent = "Type an answer first 😊";
          return;
        }
        if (user === correct) {
          feedback.textContent = "Correct! 🎉";
          feedback.classList.add("correct");
          questionStates[index].points = q.maxPoints;
        } else {
          feedback.textContent = `Incorrect – correct answer: ${q.correctAnswer}`;
          feedback.classList.add("incorrect");
          questionStates[index].points = 0;
        }
        questionStates[index].checked = true;
      } else if (q.type === "numeric") {
        const input = document.getElementById(`input-${index}`);
        const val = parseInt(input.value, 10);
        if (isNaN(val)) {
          feedback.textContent = "Enter a number first 😊";
          return;
        }
        if (val === q.correctNumber) {
          feedback.textContent = "Correct! 🎉";
          feedback.classList.add("correct");
          questionStates[index].points = q.maxPoints;
        } else {
          feedback.textContent = `Incorrect – correct answer: ${q.correctNumber}`;
          feedback.classList.add("incorrect");
          questionStates[index].points = 0;
        }
        questionStates[index].checked = true;
      } else if (q.type === "year") {
        const input = document.getElementById(`input-${index}`);
        const val = parseInt(input.value, 10);
        if (isNaN(val)) {
          feedback.textContent = "Enter a year first 😊";
          return;
        }
        const diff = Math.abs(val - q.correctYear);
        let pts = 0;
        if (diff === 0) pts = 2;
        else if (diff === 1) pts = 1;

        if (pts === 2) {
          feedback.textContent = "Bang on! 🎉 +2 points";
          feedback.classList.add("correct");
        } else if (pts === 1) {
          feedback.textContent = `Close! The correct year is ${q.correctYear}. +1 point`;
          feedback.classList.add("correct");
        } else {
          feedback.textContent = `Incorrect – correct year: ${q.correctYear}`;
          feedback.classList.add("incorrect");
        }
        questionStates[index].points = pts;
        questionStates[index].checked = true;
      }

      updateScoreAndProgress();
    }

    function revealSelfMarked(index) {
      const q = questions[index];
      const feedback = document.getElementById(`feedback-${index}`);
      feedback.classList.remove("correct", "incorrect");
      feedback.textContent = `Answer: ${q.answerText}`;
    }

    function checkSortQuestion(index) {
      const q = questions[index];
      const feedback = document.getElementById(`feedback-${index}`);
      feedback.classList.remove("correct", "incorrect");

      const list = document.getElementById(`sort-${index}`);
      const order = [...list.querySelectorAll(".sort-item")].map(li => li.dataset.value);
      const correct = q.correctOrder;
      const isCorrect = order.length === correct.length && order.every((v, i) => v === correct[i]);

      if (isCorrect) {
        feedback.textContent = "Correct order! 🎉";
        feedback.classList.add("correct");
        questionStates[index].points = q.maxPoints;
      } else {
        feedback.textContent = "Not quite – try again, or leave it and move on.";
        feedback.classList.add("incorrect");
        questionStates[index].points = 0;
      }
      questionStates[index].checked = true;
      updateScoreAndProgress();
    }

    // ------------- SCORE + PROGRESS -------------
    let lastPoints = 0;
    let lastPercent = 0;

    function updateScoreAndProgress() {
      const totalPoints = questionStates.reduce((sum, s) => sum + s.points, 0);
      const answered = questionStates.reduce((count, s) => count + (s.checked ? 1 : 0), 0);
      const progressPercent = Math.round((answered / TOTAL_QUESTIONS) * 100);
      const percentScore = Math.round((totalPoints / MAX_POINTS) * 100);

      lastPoints = totalPoints;
      lastPercent = percentScore;

      progressTextEl.textContent = `${answered} / ${TOTAL_QUESTIONS} questions checked`;
      progressBarEl.style.width = progressPercent + "%";

      scoreBox.innerHTML = `
        <div class="percent">${percentScore}%</div>
        <div class="raw">Currently ${totalPoints} out of ${MAX_POINTS} points</div>
      `;

      if (answered > 0) {
        sharePanel.style.display = "flex";
      } else {
        sharePanel.style.display = "none";
      }
    }

    updateScoreAndProgress();

    // UNANSWERED BUTTON
    jumpUnansweredBtn.addEventListener("click", () => {
      let targetIndex = questionStates.findIndex(s => !s.checked);
      if (targetIndex === -1) {
        shareStatus.textContent = "You've checked every question – nice! 🎉";
        sharePanel.style.display = "flex";
        return;
      }
      const card = document.getElementById(`card-${targetIndex}`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.style.outline = "2px solid var(--neon)";
        setTimeout(() => { card.style.outline = "none"; }, 1400);
      }
    });

    // SHARING
    const shareWhatsAppBtn = document.getElementById("share-whatsapp");
    const copyResultBtn = document.getElementById("copy-result");

    function buildShareText() {
      const baseLines = [
        `I just played "The Big Fat Sunday Quiz" on Ben's Trivia!`,
        ``,
        `My score: ${lastPoints}/${MAX_POINTS} (${lastPercent}%)`,
        ``,
        `Try to beat my score:`,
        window.location.href
      ];
      return baseLines.join("\n");
    }

    shareWhatsAppBtn.addEventListener("click", () => {
      const text = buildShareText();
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(url, "_blank");
    });

    copyResultBtn.addEventListener("click", async () => {
      const text = buildShareText();
      try {
        await navigator.clipboard.writeText(text);
        shareStatus.textContent = "Copied! Paste into Messenger, Instagram, SMS, etc.";
      } catch (err) {
        shareStatus.textContent = "Couldn't copy automatically – select and copy manually.";
      }
    });
  </script>
</body>
