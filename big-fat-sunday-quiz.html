<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Big Fat Sunday Quiz</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== HEADER (shared feel with other games) ===== */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      padding: 8px 12px 10px;
      background: linear-gradient(90deg, #020713ee, #041831ee);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(150, 208, 255, 0.3);
    }
    .header-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      height: 36px;
      width: auto;
      filter:
        drop-shadow(0 0 8px var(--neon))
        drop-shadow(0 0 18px var(--neon-soft));
    }
    .header-row-bottom {
      margin-top: 6px;
      text-align: center;
    }
    .page-title {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .page-date {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .howto-icon {
      display: none; /* Not used on this page */
    }

    .global-header #menu-btn {
      background: rgba(0,0,0,.25);
      border: 1.5px solid var(--neon);
      color: var(--neon);
      font-size: 1.3rem;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-soft);
      transition: .18s;
    }
    .global-header #menu-btn:hover {
      background: var(--neon);
      color: #001;
    }

    .menu-dropdown {
      position: absolute;
      top: 52px;
      left: 8px;
      background: var(--bg2);
      border: 1px solid var(--neon);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 0 18px var(--neon-soft);
      min-width: 210px;
      display: none;
      flex-direction: column;
      z-index: 200;
    }
    .menu-dropdown a {
      display: block;
      padding: 10px 12px;
      color: var(--text);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .menu-dropdown a:hover {
      background: var(--neon);
      color: #001;
    }

    /* Adjust body/main padding so card sits nicely under header */
    body {
      padding-top: 120px; /* header height + some breathing room */
    }
    main {
      display: grid;
      place-items: center;
      padding: 24px 16px 48px;
    }

    /* ===== Quiz card / layout ===== */
    .quiz-shell {
      width: min(960px, 100%);
    }
    .page-subtitle {
      text-align: center;
      margin: 0 0 8px;
      font-size: 1rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .quiz-meta {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 14px;
      opacity: 0.9;
    }
    .quiz-meta strong {
      color: var(--neon-soft);
    }

    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .question-card {
      background: radial-gradient(circle at top left, #12335a 0, #020a16 55%);
      border-radius: 16px;
      padding: 14px 14px 10px;
      border: 1px solid rgba(150, 208, 255, 0.35);
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.6),
        0 0 18px rgba(55, 161, 255, 0.22);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 12px;
    }
    .question-number {
      font-size: 0.82rem;
      opacity: 0.85;
    }
    .question-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .options {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 640px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
    .option-label {
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.3);
      padding: 7px 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: rgba(3, 15, 34, 0.8);
      transition: 0.06s ease-out;
    }
    .option-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(55, 161, 255, 0.45);
      border-color: var(--neon-soft);
    }
    .option-label input { accent-color: var(--neon); }
    .option-label.correct {
      border-color: var(--good);
      box-shadow: 0 0 14px rgba(56, 239, 125, 0.7);
    }
    .option-label.chosen-wrong {
      border-color: var(--bad);
      box-shadow: 0 0 14px rgba(255, 66, 102, 0.7);
    }

    .btn-question {
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.7);
      background: rgba(3, 15, 34, 0.95);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .feedback {
      margin-top: 6px;
      font-size: 0.82rem;
      min-height: 16px;
    }
    .feedback.correct { color: var(--good); }
    .feedback.incorrect { color: var(--bad); }

    /* Progress bar & buttons */
    .progress-wrap {
      max-width: 480px;
      margin: 0 auto 10px;
      text-align: left;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .progress-label {
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .progress-bar-outer {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(4, 20, 40, 0.9);
      border: 1px solid rgba(150, 208, 255, 0.5);
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--neon-soft), var(--good));
      box-shadow:
        0 0 14px rgba(55, 161, 255, 0.7),
        0 0 24px rgba(56, 239, 125, 0.7);
      transition: width 0.15s ease-out;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(3, 15, 34, 0.9);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary:active { transform: translateY(1px); }

    .score-box {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
    }
    .score-box .percent {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--neon-soft);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .score-box .raw {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .share-panel {
      margin-top: 12px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .global-footer {
      text-align: center;
      padding: 12px 8px 20px;
      font-size: 0.85rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .header-logo {
        height: 30px;
      }
      .page-title {
        font-size: 0.95rem;
      }
      .quiz-shell {
        padding: 18px 14px;
      }
    }
  </style>
</head>

  <!-- UNIVERSAL HEADER -->

    <div class="header-row-top">
      <div class="header-left">
        <button id="menu-btn">☰</button>
        <img src="logo.png" class="header-logo" alt="Ben's Trivia Logo">
      </div>
      <!-- how-to icon only used on connections page; hidden here -->
      <div class="howto-icon" id="howto-icon" style="display:none;">?</div>
    </div>

    <div class="header-row-bottom">
      <h1 class="page-title">The Big Fat Sunday Quiz</h1>
      <span class="page-date" id="page-date"></span>
    </div>

    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Daily Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
      <a href="connections.html">🧩 Connections</a>
      <a href="big-fat-sunday-quiz.html">🍻 Big Fat Sunday Quiz</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <main>
    <section class="game-card card quiz-shell">
      <p class="page-subtitle">25 questions. New quiz every Sunday.</p>

      <div id="quiz-meta" class="quiz-meta">
        <strong id="quiz-title"></strong><br>
        <span id="quiz-week-info"></span>
      </div>

      <div class="quiz-container" id="quiz-container"></div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-text">0 / 25 answered</span>
        </div>
        <div class="progress-bar-outer">
          <div id="progress-bar" class="progress-bar-inner"></div>
        </div>
      </div>

      <button class="btn-secondary" id="jump-unanswered">
        Show first unanswered question
      </button>

      <div class="score-box" id="score-box"></div>

      <div class="share-panel" id="share-panel" style="display:none;">
        <div class="share-buttons">
          <button class="btn-secondary" id="share-whatsapp">Share via WhatsApp</button>
          <button class="btn-secondary" id="copy-result">Copy result</button>
        </div>
        <div id="share-status" style="font-size:11px; opacity:0.8; margin-top:6px;"></div>
      </div>
    </section>
  </main>

  <footer class="global-footer" id="footer-text"></footer>

            options: ["Pakistan", "Bangladesh", "India", "Sri Lanka"], correctIndex: 2 },
          { q: "Which war ended in 1945?",
            options: ["World War I", "World War II", "Vietnam War", "Korean War"], correctIndex: 1 },
          { q: "Mount Everest lies on the border of Nepal and which country?",
            options: ["China", "India", "Bhutan", "Pakistan"], correctIndex: 0 },
          { q: "Which famous ship sank on its maiden voyage in 1912?",
            options: ["Lusitania", "Titanic", "Bismarck", "Endeavour"], correctIndex: 1 },
          { q: "Which continent is the Sahara Desert in?",
            options: ["Asia", "Africa", "Australia", "South America"], correctIndex: 1 },
          { q: "What is the largest land animal on Earth?",
            options: ["Giraffe", "White rhino", "African elephant", "Hippopotamus"], correctIndex: 2 },
          { q: "Which country is both an island and a continent?",
            options: ["New Zealand", "Iceland", "Australia", "Madagascar"], correctIndex: 2 },
          { q: "Who developed the theory of relativity?",
            options: ["Isaac Newton", "Albert Einstein", "Nikola Tesla", "Galileo Galilei"], correctIndex: 1 },
          { q: "Which city is known as 'The Big Apple'?",
            options: ["Los Angeles", "Chicago", "New York City", "San Francisco"], correctIndex: 2 },
          { q: "Which country gave the world pizza and pasta (as we know them)?",
            options: ["France", "Italy", "Greece", "Spain"], correctIndex: 1 },
          { q: "What is the main gas found in the air we breathe?",
            options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"], correctIndex: 2 },
          { q: "Which country is famous for the landmark Machu Picchu?",
            options: ["Peru", "Chile", "Mexico", "Guatemala"], correctIndex: 0 },
          { q: "Which city hosted the first modern Olympic Games (1896)?",
            options: ["Paris", "Rome", "Athens", "London"], correctIndex: 2 },
          { q: "What is the largest internal organ in the human body?",
            options: ["Heart", "Liver", "Lungs", "Kidneys"], correctIndex: 1 },
          { q: "Which planet is closest to the Sun?",
            options: ["Venus", "Mercury", "Earth", "Mars"], correctIndex: 1 },
          { q: "Which instrument is known as the 'king of instruments'?",
            options: ["Piano", "Organ", "Violin", "Trumpet"], correctIndex: 1 },
          { q: "What is the currency of the United Kingdom?",
            options: ["Euro", "US Dollar", "Pound sterling", "Swiss franc"], correctIndex: 2 },
          { q: "Which desert covers much of central Australia?",
            options: ["Gobi Desert", "Great Sandy Desert", "Atacama Desert", "Kalahari Desert"], correctIndex: 1 },
          { q: "Which scientist is famous for the apple falling from a tree story?",
            options: ["Albert Einstein", "Marie Curie", "Isaac Newton", "Charles Darwin"], correctIndex: 2 },
          { q: "Which country has the maple leaf on its flag?",
            options: ["Canada", "Denmark", "Norway", "Sweden"], correctIndex: 0 },
          { q: "Which city is home to the Eiffel Tower?",
            options: ["Rome", "Paris", "Berlin", "Madrid"], correctIndex: 1 },
          { q: "Which sea lies between Europe and Africa?",
            options: ["Caribbean Sea", "Mediterranean Sea", "Black Sea", "Red Sea"], correctIndex: 1 }
        ]
      }
    ];

    // ------------------------------
    // WEEK CALC + QUIZ SELECTION
    // ------------------------------
    function getWeekOfYear(date) {
      const tempDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = tempDate.getUTCDay() || 7;
      tempDate.setUTCDate(tempDate.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
      return Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
    }

    function getMostRecentSunday(date) {
      const d = new Date(date);
      const day = d.getDay(); // 0 = Sunday
      const diff = day;
      d.setDate(d.getDate() - diff);
      return d;
    }

    function formatNiceDate(date) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    const today = new Date();
    const weekOfYear = getWeekOfYear(today);
    const quizIndex = (weekOfYear - 1) % quizSets.length;
    const currentQuiz = quizSets[quizIndex];

    const recentSunday = getMostRecentSunday(today);
    const uploadDateText = formatNiceDate(recentSunday);

    // ------------------------------
    // RENDER QUIZ
    // ------------------------------
    const quizContainer = document.getElementById("quiz-container");
    const quizTitleEl = document.getElementById("quiz-title");
    const quizWeekInfoEl = document.getElementById("quiz-week-info");
    const footerMetaEl = document.getElementById("footer-text");

    quizTitleEl.textContent = currentQuiz.title;
    quizWeekInfoEl.textContent = `Current set: Week ${quizIndex + 1} · ${currentQuiz.questions.length} questions · New quiz every Sunday`;

    // Footer: Made by Ben · Week X · Sunday, 23 November 2025
    (function setFooter() {
      const fullDate = today.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
      footerMetaEl.textContent = `Made by Ben · Week ${quizIndex + 1} · ${fullDate}`;
    })();

    const questionStates = currentQuiz.questions.map(() => ({
      checked: false,
      correct: false
    }));

    function renderQuiz() {
      quizContainer.innerHTML = "";
      currentQuiz.questions.forEach((qObj, qIndex) => {
        const card = document.createElement("article");
        card.className = "question-card";
        card.id = `card-${qIndex}`;

        const header = document.createElement("div");
        header.className = "question-header";

        const qNumber = document.createElement("div");
        qNumber.className = "question-number";
        qNumber.textContent = `Question ${qIndex + 1}`;

        const qText = document.createElement("div");
        qText.className = "question-text";
        qText.textContent = qObj.q;

        header.appendChild(qNumber);
        header.appendChild(qText);

        const optionsWrap = document.createElement("div");
        optionsWrap.className = "options";

        qObj.options.forEach((optText, optIndex) => {
          const id = `q${qIndex}_opt${optIndex}`;
          const label = document.createElement("label");
          label.className = "option-label";
          label.setAttribute("for", id);
          label.dataset.q = qIndex;
          label.dataset.opt = optIndex;

          const input = document.createElement("input");
          input.type = "radio";
          input.name = `q${qIndex}`;
          input.id = id;
          input.value = optIndex;

          const span = document.createElement("span");
          span.textContent = optText;

          label.appendChild(input);
          label.appendChild(span);
          optionsWrap.appendChild(label);
        });

        const checkBtn = document.createElement("button");
        checkBtn.className = "btn-question";
        checkBtn.type = "button";
        checkBtn.textContent = "Check answer";
        checkBtn.addEventListener("click", () => checkQuestion(qIndex));

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.id = `feedback-${qIndex}`;

        card.appendChild(header);
        card.appendChild(optionsWrap);
        card.appendChild(checkBtn);
        card.appendChild(feedback);

        quizContainer.appendChild(card);
      });
    }

    renderQuiz();

    // ------------------------------
    // PER-QUESTION CHECK + SCORE + PROGRESS
    // ------------------------------
    const scoreBox = document.getElementById("score-box");
    const sharePanel = document.getElementById("share-panel");
    const shareStatus = document.getElementById("share-status");

    const progressTextEl = document.getElementById("progress-text");
    const progressBarEl = document.getElementById("progress-bar");
    const jumpUnansweredBtn = document.getElementById("jump-unanswered");

    let lastScore = 0;
    let lastPercent = 0;

    function checkQuestion(qIndex) {
      const qObj = currentQuiz.questions[qIndex];
      const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
      const feedbackEl = document.getElementById(`feedback-${qIndex}`);

      const labels = document.querySelectorAll(`label.option-label[data-q="${qIndex}"]`);
      labels.forEach(label => {
        label.classList.remove("correct", "chosen-wrong");
      });

      if (!selected) {
        feedbackEl.textContent = "Choose an answer first 😊";
        feedbackEl.classList.remove("correct", "incorrect");
        return;
      }

      const chosenIndex = Number(selected.value);
      const correctIndex = qObj.correctIndex;

      if (chosenIndex === correctIndex) {
        feedbackEl.textContent = "Correct! 🎉";
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
      } else {
        feedbackEl.textContent = `Incorrect – correct answer: ${qObj.options[correctIndex]}`;
        feedbackEl.classList.add("incorrect");
        feedbackEl.classList.remove("correct");
      }

      labels.forEach(label => {
        const opt = Number(label.dataset.opt);
        if (opt === correctIndex) {
          label.classList.add("correct");
        } else if (opt === chosenIndex && chosenIndex !== correctIndex) {
          label.classList.add("chosen-wrong");
        }
      });

      questionStates[qIndex].checked = true;
      questionStates[qIndex].correct = (chosenIndex === correctIndex);

      updateScoreAndProgress();
    }

    function updateScoreAndProgress() {
      const total = currentQuiz.questions.length;

      let correct = 0;
      questionStates.forEach(s => {
        if (s.correct) correct++;
      });
      const percent = Math.round((correct / total) * 100);
      lastScore = correct;
      lastPercent = percent;

      scoreBox.innerHTML = `
        <div class="percent">${percent}%</div>
        <div class="raw">Currently ${correct} out of ${total} questions correct</div>
      `;

      if (correct > 0) {
        sharePanel.style.display = "flex";
        shareStatus.textContent = "";
      } else {
        sharePanel.style.display = "none";
      }

      let answered = 0;
      questionStates.forEach(s => { if (s.checked) answered++; });
      const progressPercent = Math.round((answered / total) * 100);

      progressTextEl.textContent = `${answered} / ${total} answered`;
      progressBarEl.style.width = progressPercent + "%";
    }

    updateScoreAndProgress();

    // ------------------------------
    // UNANSWERED QUESTION BUTTON
    // ------------------------------
    jumpUnansweredBtn.addEventListener("click", () => {
      const total = questionStates.length;
      let targetIndex = -1;

      for (let i = 0; i < total; i++) {
        if (!questionStates[i].checked) {
          targetIndex = i;
          break;
        }
      }

      if (targetIndex === -1) {
        shareStatus.textContent = "You've checked every question – nice! 🎉";
        sharePanel.style.display = "flex";
        return;
      }

      const card = document.getElementById(`card-${targetIndex}`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.style.outline = "2px solid var(--neon)";
        setTimeout(() => {
          card.style.outline = "none";
        }, 1400);
      }
    });

    // ------------------------------
    // SHARING
    // ------------------------------
    const shareWhatsAppBtn = document.getElementById("share-whatsapp");
    const copyResultBtn = document.getElementById("copy-result");

    function buildShareText() {
      const total = currentQuiz.questions.length;
      const base = `I just played "The Big Fat Sunday Quiz" on Ben's Trivia and so far I've got ${lastScore}/${total} (${lastPercent}%) correct!`;
      const link = window.location.href;
      return `${base} Try to beat my score: ${link}`;
    }

    shareWhatsAppBtn.addEventListener("click", () => {
      const text = buildShareText();
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(url, "_blank");
    });

    copyResultBtn.addEventListener("click", async () => {
      const text = buildShareText();
      try {
        await navigator.clipboard.writeText(text);
        shareStatus.textContent = "Copied! Paste into Messenger, Instagram, SMS, etc.";
      } catch (err) {
        shareStatus.textContent = "Couldn't copy automatically – select and copy manually.";
      }
    });
  </script>
</body>
