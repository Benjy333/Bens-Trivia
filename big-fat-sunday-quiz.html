<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Big Fat Sunday Quiz</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== HEADER (shared feel with other games) ===== */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      padding: 10px 14px 12px;
      background: linear-gradient(90deg, #020713ee, #041831ee);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(150, 208, 255, 0.3);
    }
    .header-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      height: 52px;
      width: auto;
      filter:
        drop-shadow(0 0 8px var(--neon))
        drop-shadow(0 0 18px var(--neon-soft));
    }
    .header-row-bottom {
      margin-top: 6px;
      text-align: center;
    }
    .page-title {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .page-date {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .howto-icon {
      display: none; /* Not used on this page */
    }

    .global-header #menu-btn {
      background: rgba(0,0,0,.25);
      border: 1.5px solid var(--neon);
      color: var(--neon);
      font-size: 1.3rem;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-soft);
      transition: .18s;
    }
    .global-header #menu-btn:hover {
      background: var(--neon);
      color: #001;
    }

    .menu-dropdown {
      position: absolute;
      top: 60px;
      left: 8px;
      background: var(--bg2);
      border: 1px solid var(--neon);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 0 18px var(--neon-soft);
      min-width: 210px;
      display: none;
      flex-direction: column;
      z-index: 200;
    }
    .menu-dropdown a {
      display: block;
      padding: 10px 12px;
      color: var(--text);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .menu-dropdown a:hover {
      background: var(--neon);
      color: #001;
    }

    /* Adjust body/main padding so card sits nicely under header */
    body {
      padding-top: 140px;
    }
    main {
      display: grid;
      place-items: center;
      padding: 24px 16px 48px;
    }

    /* ===== Quiz card / layout ===== */
    .quiz-shell {
      width: min(960px, 100%);
    }
    .page-subtitle {
      text-align: center;
      margin: 0 0 8px;
      font-size: 1rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }
    .quiz-meta {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 14px;
      opacity: 0.9;
    }
    .quiz-meta strong {
      color: var(--neon-soft);
    }

    .quiz-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .question-card {
      background: radial-gradient(circle at top left, #12335a 0, #020a16 55%);
      border-radius: 16px;
      padding: 14px 14px 10px;
      border: 1px solid rgba(150, 208, 255, 0.35);
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.6),
        0 0 18px rgba(55, 161, 255, 0.22);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 12px;
    }
    .question-number {
      font-size: 0.82rem;
      opacity: 0.85;
    }
    .question-text {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .question-tag {
      font-size: 0.75rem;
      opacity: 0.85;
      border-radius: 999px;
      border: 1px solid rgba(150,208,255,0.5);
      padding: 2px 8px;
      margin-left: auto;
    }

    .question-body {
      margin-top: 6px;
    }

    .question-media {
      margin: 6px 0 8px;
      text-align: center;
    }
    .question-media img {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(150,208,255,0.4);
    }

    .options {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 640px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
    .option-label {
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.3);
      padding: 7px 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: rgba(3, 15, 34, 0.8);
      transition: 0.06s ease-out;
    }
    .option-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(55, 161, 255, 0.45);
      border-color: var(--neon-soft);
    }
    .option-label input { accent-color: var(--neon); }
    .option-label.correct {
      border-color: var(--good);
      box-shadow: 0 0 14px rgba(56, 239, 125, 0.7);
    }
    .option-label.chosen-wrong {
      border-color: var(--bad);
      box-shadow: 0 0 14px rgba(255, 66, 102, 0.7);
    }

    .bf-input {
      width: 100%;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.5);
      background: rgba(2, 10, 22, 0.95);
      color: #e9f4ff;
      font-size: 0.9rem;
    }
    .bf-input:focus {
      outline: none;
      border-color: var(--neon-soft);
      box-shadow: 0 0 10px rgba(55, 161, 255, 0.5);
    }

    .btn-question {
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.7);
      background: rgba(3, 15, 34, 0.95);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-mini {
      margin-top: 6px;
      margin-right: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(1, 10, 22, 0.95);
      color: #e9f4ff;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .feedback {
      margin-top: 6px;
      font-size: 0.82rem;
      min-height: 16px;
    }
    .feedback.correct { color: var(--good); }
    .feedback.incorrect { color: var(--bad); }

    /* List-style question */
    .list-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    @media (max-width: 640px) {
      .list-inputs {
        grid-template-columns: 1fr;
      }
    }
    .list-score-controls {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
    }
    .list-score-controls input {
      width: 60px;
    }

    /* Sort question */
    .sort-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sort-item {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(150,208,255,0.5);
      background: rgba(3,15,34,0.95);
      cursor: grab;
      font-size: 0.9rem;
    }
    .sort-item.dragging {
      opacity: 0.6;
      border-style: dashed;
    }

    /* Progress bar & buttons */
    .progress-wrap {
      max-width: 480px;
      margin: 0 auto 10px;
      text-align: left;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .progress-label {
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .progress-bar-outer {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(4, 20, 40, 0.9);
      border: 1px solid rgba(150, 208, 255, 0.5);
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--neon-soft), var(--good));
      box-shadow:
        0 0 14px rgba(55, 161, 255, 0.7),
        0 0 24px rgba(56, 239, 125, 0.7);
      transition: width 0.15s ease-out;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(150, 208, 255, 0.6);
      background: rgba(3, 15, 34, 0.9);
      color: #e9f4ff;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary:active { transform: translateY(1px); }

    .score-box {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
    }
    .score-box .percent {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--neon-soft);
      text-shadow: 0 0 8px var(--neon-soft);
    }
    .score-box .raw {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .share-panel {
      margin-top: 12px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .global-footer {
      text-align: center;
      padding: 12px 8px 20px;
      font-size: 0.85rem;
      color: var(--neon-soft);
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .header-logo {
        height: 44px;
      }
      .page-title {
        font-size: 0.95rem;
      }
      .quiz-shell {
        padding: 18px 14px;
      }
    }
  </style>
</head>

<body>
  <!-- UNIVERSAL HEADER -->
  <header class="global-header">
    <div class="header-row-top">
      <div class="header-left">
        <button id="menu-btn">☰</button>
        <img src="logo.png" class="header-logo" alt="Ben's Trivia Logo">
      </div>
      <div class="howto-icon" id="howto-icon" style="display:none;">?</div>
    </div>

    <div class="header-row-bottom">
      <h1 class="page-title">The Big Fat Sunday Quiz</h1>
      <span class="page-date" id="page-date"></span>
    </div>

    <nav class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">🎯 Daily Trivia</a>
      <a href="anagram.html">🔤 Anagram Game</a>
      <a href="riddle.html">🕵️ Riddle Game</a>
      <a href="connections.html">🧩 Connections</a>
      <a href="big-fat-sunday-quiz.html">🍻 Big Fat Sunday Quiz</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <main>
    <section class="game-card card quiz-shell">
      <p class="page-subtitle">25 questions. One big quiz.</p>

      <div id="quiz-meta" class="quiz-meta">
        <strong id="quiz-title"></strong><br>
        <span id="quiz-week-info"></span>
      </div>

      <div class="quiz-container" id="quiz-container"></div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-text">0 / 25 answered</span>
        </div>
        <div class="progress-bar-outer">
          <div id="progress-bar" class="progress-bar-inner"></div>
        </div>
      </div>

      <button class="btn-secondary" id="jump-unanswered">
        Show first unanswered question
      </button>

      <div class="score-box" id="score-box"></div>

      <div class="share-panel" id="share-panel" style="display:none;">
        <div class="share-buttons">
          <button class="btn-secondary" id="share-whatsapp">Share via WhatsApp</button>
          <button class="btn-secondary" id="copy-result">Copy result</button>
        </div>
        <div id="share-status" style="font-size:11px; opacity:0.8; margin-top:6px;"></div>
      </div>
    </section>
  </main>

  <footer class="global-footer" id="footer-text"></footer>

  <script>
    // ------------------------------
    // HEADER DATE
    // ------------------------------
    (function setHeaderDate() {
      const today = new Date();
      const headerDate = document.getElementById("page-date");
      headerDate.textContent = today.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    })();

    // ------------------------------
    // MENU TOGGLE
    // ------------------------------
    const menuBtn = document.getElementById("menu-btn");
    const menuDropdown = document.getElementById("menu-dropdown");

    menuBtn.addEventListener("click", () => {
      const isOpen = menuDropdown.style.display === "flex";
      menuDropdown.style.display = isOpen ? "none" : "flex";
    });

    document.addEventListener("click", (e) => {
      if (!menuDropdown.contains(e.target) && !menuBtn.contains(e.target)) {
        menuDropdown.style.display = "none";
      }
    });

    // ------------------------------
    // QUIZ DATA (25 questions)
    // ------------------------------
    const questions = [
      {
        type: "textReveal",
        tag: "MS Paint Poster",
        q: "MS Paint movie poster – which film is this?",
        answer: "The Lion King",
        image: "film.png",
        maxPoints: 1
      },
      {
        type: "listSelf",
        tag: "List Question",
        q: "Name each planet with rings.",
        listAnswers: ["Saturn", "Jupiter", "Uranus", "Neptune"],
        maxPoints: 4
      },
      {
        type: "mcq",
        q: "Which language has the most native speakers?",
        options: ["English", "Spanish", "Mandarin Chinese", "Hindi"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "What is the smallest prime number?",
        options: ["0", "1", "2", "3"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which film features the line “You can't handle the truth!”?",
        options: ["A Few Good Men", "Top Gun", "Die Hard", "The Godfather"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "textReveal",
        tag: "Morphed celebrity",
        q: "Morphed celebrity – who are the two actors?",
        answer: "John Travolta and Tom Cruise",
        image: "morph.png",
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "In the Marvel films, what is Thor’s hammer called?",
        options: ["Gungnir", "Stormbreaker", "Mjolnir", "Aegis"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "What is the main gas found in the air we breathe?",
        options: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"],
        correctIndex: 2,
        maxPoints: 1
      },
      {
        type: "textExact",
        tag: "Anagram",
        q: "Anagram – hint: it's an animal. Letters: “Platypus rearrange”",
        answer: "Platypus",
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "What is the largest internal organ in the human body?",
        options: ["Heart", "Liver", "Lungs", "Kidneys"],
        correctIndex: 1,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "What does a sphygmomanometer measure?",
        options: ["Blood sugar", "Blood pressure", "Lung capacity", "Heart rate"],
        correctIndex: 1,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which is Shakespeare’s longest play?",
        options: ["Macbeth", "Hamlet", "King Lear", "Othello"],
        correctIndex: 1,
        maxPoints: 1
      },
      {
        type: "textReveal",
        tag: "Guess the credits",
        q: "Guess the movie from these credits.",
        answer: "Rain Man",
        image: "credits.png",
        maxPoints: 1
      },
      {
        type: "sort3",
        tag: "Sort by word count",
        q: "Sort these books by number of words, from least to most.",
        items: ["Lord of the Rings", "Harry Potter", "King James Bible"],
        correctOrder: ["Lord of the Rings", "Harry Potter", "King James Bible"],
        maxPoints: 1
      },
      {
        type: "textReveal",
        tag: "Flag",
        q: "What country does this flag belong to?",
        answer: "Singapore",
        image: "flag.png",
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which country has won the most FIFA World Cups (men’s)?",
        options: ["Germany", "Italy", "Argentina", "Brazil"],
        correctIndex: 3,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which country is famous for the landmark Machu Picchu?",
        options: ["Peru", "Chile", "Mexico", "Guatemala"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "year",
        tag: "Guess the year",
        q: "In what year did Toy Story 2 release and Chappelle Roan born?",
        correctYear: 1998,
        maxPoints: 2
      },
      {
        type: "number",
        tag: "Maths puzzle",
        q: "How many right angles does a clock face make in a 12 hour period?",
        correctNumber: 22,
        maxPoints: 1
      },
      {
        type: "mcq",
        tag: "Random silly",
        q: "Which country will host the next Olympics?",
        options: ["Los Angeles, United States", "Tokyo, Japan", "Brisbane, Australia", "Barcelona, Spain"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "In tennis, what is the score when both players have 40?",
        options: ["Deuce", "Love", "Advantage", "Tie"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which of these is NOT a colour on the Olympic rings?",
        options: ["Black", "White", "Green", "Yellow"],
        correctIndex: 1,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "What is the maximum break in snooker?",
        options: ["147", "155", "167", "180"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "mcq",
        tag: "Topical",
        q: "Which one of these was NOT an Olympic event?",
        options: ["Blind archery", "Solo Synchronised Swimming", "Hot air ballooning", "Live pigeon shooting"],
        correctIndex: 0,
        maxPoints: 1
      },
      {
        type: "mcq",
        q: "Which country is home to the city of Vienna?",
        options: ["Germany", "Austria", "Switzerland", "Czech Republic"],
        correctIndex: 1,
        maxPoints: 1
      }
    ];

    // ------------------------------
    // STATE & RENDERING
    // ------------------------------
    const quizContainer = document.getElementById("quiz-container");
    const quizTitleEl = document.getElementById("quiz-title");
    const quizWeekInfoEl = document.getElementById("quiz-week-info");
    const footerMetaEl = document.getElementById("footer-text");

    const today = new Date();

    quizTitleEl.textContent = "General Knowledge – Big Fat Sunday Quiz";
    quizWeekInfoEl.textContent = `${questions.length} questions · Mixed rounds & specials`;

    (function setFooter() {
      const fullDate = today.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
      footerMetaEl.textContent = `Made by Ben · ${fullDate}`;
    })();

    const questionStates = questions.map(q => ({
      answered: false,
      score: 0,
      maxPoints: q.maxPoints || (q.type === "year" ? 2 : 1)
    }));

    const totalMaxPoints = questionStates.reduce((sum, s) => sum + s.maxPoints, 0);

    function createOptionLabel(qIndex, optText, optIndex, nameId) {
      const id = `${nameId}_opt${optIndex}`;
      const label = document.createElement("label");
      label.className = "option-label";
      label.setAttribute("for", id);
      label.dataset.q = qIndex;
      label.dataset.opt = optIndex;

      const input = document.createElement("input");
      input.type = "radio";
      input.name = nameId;
      input.id = id;
      input.value = optIndex;

      const span = document.createElement("span");
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      return label;
    }

    function renderQuiz() {
      quizContainer.innerHTML = "";
      questions.forEach((qObj, qIndex) => {
        const card = document.createElement("article");
        card.className = "question-card";
        card.id = `card-${qIndex}`;

        const header = document.createElement("div");
        header.className = "question-header";

        const qNumber = document.createElement("div");
        qNumber.className = "question-number";
        qNumber.textContent = `Question ${qIndex + 1}`;

        const qText = document.createElement("div");
        qText.className = "question-text";
        qText.textContent = qObj.q;

        header.appendChild(qNumber);
        header.appendChild(qText);

        if (qObj.tag) {
          const tag = document.createElement("div");
          tag.className = "question-tag";
          tag.textContent = qObj.tag;
          header.appendChild(tag);
        }

        const body = document.createElement("div");
        body.className = "question-body";

        if (qObj.image) {
          const media = document.createElement("div");
          media.className = "question-media";
          const img = document.createElement("img");
          img.src = qObj.image;
          img.alt = "Question image";
          media.appendChild(img);
          body.appendChild(media);
        }

        let feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.id = `feedback-${qIndex}`;

        // Render by type
        if (qObj.type === "mcq") {
          const optionsWrap = document.createElement("div");
          optionsWrap.className = "options";

          qObj.options.forEach((optText, optIndex) => {
            const label = createOptionLabel(qIndex, optText, optIndex, `q${qIndex}`);
            optionsWrap.appendChild(label);
          });

          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check answer";
          checkBtn.addEventListener("click", () => checkMcqQuestion(qIndex));

          body.appendChild(optionsWrap);
          body.appendChild(checkBtn);
        } else if (qObj.type === "year") {
          const input = document.createElement("input");
          input.type = "number";
          input.className = "bf-input";
          input.placeholder = "Enter a year";

          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check year";
          checkBtn.addEventListener("click", () => checkYearQuestion(qIndex, input));

          body.appendChild(input);
          body.appendChild(checkBtn);
        } else if (qObj.type === "number") {
          const input = document.createElement("input");
          input.type = "number";
          input.className = "bf-input";
          input.placeholder = "Enter a number";

          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check answer";
          checkBtn.addEventListener("click", () => checkNumberQuestion(qIndex, input));

          body.appendChild(input);
          body.appendChild(checkBtn);
        } else if (qObj.type === "textExact") {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "bf-input";
          input.placeholder = "Type your answer";

          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check answer";
          checkBtn.addEventListener("click", () => checkTextExactQuestion(qIndex, input));

          body.appendChild(input);
          body.appendChild(checkBtn);
        } else if (qObj.type === "textReveal") {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "bf-input";
          input.placeholder = "Type your guess (optional)";

          const revealBtn = document.createElement("button");
          revealBtn.className = "btn-question";
          revealBtn.type = "button";
          revealBtn.textContent = "Reveal answer";

          const answerDiv = document.createElement("div");
          answerDiv.style.marginTop = "6px";
          answerDiv.style.fontSize = "0.85rem";
          answerDiv.style.display = "none";

          const rightBtn = document.createElement("button");
          rightBtn.className = "btn-mini";
          rightBtn.textContent = "I got it right (+1)";
          rightBtn.style.display = "none";

          const wrongBtn = document.createElement("button");
          wrongBtn.className = "btn-mini";
          wrongBtn.textContent = "I got it wrong (0)";
          wrongBtn.style.display = "none";

          revealBtn.addEventListener("click", () => {
            answerDiv.textContent = `Answer: ${qObj.answer}`;
            answerDiv.style.display = "block";
            rightBtn.style.display = "inline-block";
            wrongBtn.style.display = "inline-block";
          });

          rightBtn.addEventListener("click", () => {
            questionStates[qIndex].score = qObj.maxPoints || 1;
            questionStates[qIndex].answered = true;
            feedback.textContent = "Marked as correct ✅";
            feedback.classList.add("correct");
            feedback.classList.remove("incorrect");
            updateScoreAndProgress();
          });

          wrongBtn.addEventListener("click", () => {
            questionStates[qIndex].score = 0;
            questionStates[qIndex].answered = true;
            feedback.textContent = "Marked as incorrect.";
            feedback.classList.add("incorrect");
            feedback.classList.remove("correct");
            updateScoreAndProgress();
          });

          body.appendChild(input);
          body.appendChild(revealBtn);
          body.appendChild(answerDiv);
          body.appendChild(rightBtn);
          body.appendChild(wrongBtn);
        } else if (qObj.type === "listSelf") {
          const helper = document.createElement("div");
          helper.style.fontSize = "0.8rem";
          helper.style.opacity = "0.85";
          helper.textContent = "Enter as many as you can, then reveal and choose how many points you earned.";

          const listWrap = document.createElement("div");
          listWrap.className = "list-inputs";

          const numBoxes = qObj.listAnswers.length;
          for (let i = 0; i < numBoxes; i++) {
            const inp = document.createElement("input");
            inp.type = "text";
            inp.className = "bf-input";
            inp.placeholder = `Answer ${i + 1}`;
            listWrap.appendChild(inp);
          }

          const revealBtn = document.createElement("button");
          revealBtn.className = "btn-question";
          revealBtn.type = "button";
          revealBtn.textContent = "Reveal answers";

          const answersDiv = document.createElement("div");
          answersDiv.style.marginTop = "6px";
          answersDiv.style.fontSize = "0.85rem";
          answersDiv.style.display = "none";

          const scoreControls = document.createElement("div");
          scoreControls.className = "list-score-controls";
          scoreControls.style.display = "none";

          const label = document.createElement("span");
          label.textContent = `How many did you get right? (0–${qObj.listAnswers.length})`;

          const numInput = document.createElement("input");
          numInput.type = "number";
          numInput.min = 0;
          numInput.max = qObj.listAnswers.length;
          numInput.value = 0;
          numInput.className = "bf-input";

          const saveBtn = document.createElement("button");
          saveBtn.className = "btn-mini";
          saveBtn.textContent = "Save score";

          revealBtn.addEventListener("click", () => {
            answersDiv.innerHTML = `Answers: <strong>${qObj.listAnswers.join(", ")}</strong>`;
            answersDiv.style.display = "block";
            scoreControls.style.display = "flex";
          });

          saveBtn.addEventListener("click", () => {
            let val = parseInt(numInput.value, 10);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0;
            if (val > qObj.listAnswers.length) val = qObj.listAnswers.length;
            questionStates[qIndex].score = val;
            questionStates[qIndex].answered = true;
            feedback.textContent = `Saved ${val} point(s) for this question.`;
            feedback.classList.remove("incorrect");
            feedback.classList.add("correct");
            updateScoreAndProgress();
          });

          scoreControls.appendChild(label);
          scoreControls.appendChild(numInput);
          scoreControls.appendChild(saveBtn);

          body.appendChild(helper);
          body.appendChild(listWrap);
          body.appendChild(revealBtn);
          body.appendChild(answersDiv);
          body.appendChild(scoreControls);
        } else if (qObj.type === "sort3") {
          const list = document.createElement("div");
          list.className = "sort-list";
          qObj.items.forEach(text => {
            const item = document.createElement("div");
            item.className = "sort-item";
            item.textContent = text;
            item.draggable = true;
            list.appendChild(item);
          });

          let draggedItem = null;

          list.addEventListener("dragstart", (e) => {
            if (e.target.classList.contains("sort-item")) {
              draggedItem = e.target;
              e.target.classList.add("dragging");
            }
          });
          list.addEventListener("dragend", (e) => {
            if (e.target.classList.contains("sort-item")) {
              e.target.classList.remove("dragging");
            }
          });
          list.addEventListener("dragover", (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            if (draggedItem) {
              if (afterElement == null) {
                list.appendChild(draggedItem);
              } else {
                list.insertBefore(draggedItem, afterElement);
              }
            }
          });

          function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll(".sort-item:not(.dragging)")];
            return draggableElements.reduce(
              (closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                  return { offset: offset, element: child };
                } else {
                  return closest;
                }
              },
              { offset: Number.NEGATIVE_INFINITY, element: null }
            ).element;
          }

          const checkBtn = document.createElement("button");
          checkBtn.className = "btn-question";
          checkBtn.type = "button";
          checkBtn.textContent = "Check order";

          checkBtn.addEventListener("click", () => {
            const currentOrder = Array.from(list.children).map(el => el.textContent.trim());
            const correctOrder = qObj.correctOrder;
            const isCorrect = currentOrder.every((val, idx) => val === correctOrder[idx]);

            questionStates[qIndex].answered = true;
            questionStates[qIndex].score = isCorrect ? 1 : 0;

            if (isCorrect) {
              feedback.textContent = "Perfect order! ✅";
              feedback.classList.add("correct");
              feedback.classList.remove("incorrect");
            } else {
              feedback.textContent = `Not quite. Correct order is: ${correctOrder.join(" → ")}`;
              feedback.classList.add("incorrect");
              feedback.classList.remove("correct");
            }
            updateScoreAndProgress();
          });

          body.appendChild(list);
          body.appendChild(checkBtn);
        }

        card.appendChild(header);
        card.appendChild(body);
        card.appendChild(feedback);
        quizContainer.appendChild(card);
      });
    }

    renderQuiz();

    // ------------------------------
    // CHECKERS
    // ------------------------------
    const scoreBox = document.getElementById("score-box");
    const sharePanel = document.getElementById("share-panel");
    const shareStatus = document.getElementById("share-status");

    const progressTextEl = document.getElementById("progress-text");
    const progressBarEl = document.getElementById("progress-bar");
    const jumpUnansweredBtn = document.getElementById("jump-unanswered");

    let lastScore = 0;
    let lastPercent = 0;

    function resetOptionStyles(qIndex) {
      const labels = document.querySelectorAll(`label.option-label[data-q="${qIndex}"]`);
      labels.forEach(label => {
        label.classList.remove("correct", "chosen-wrong");
      });
    }

    function checkMcqQuestion(qIndex) {
      const qObj = questions[qIndex];
      const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
      const feedbackEl = document.getElementById(`feedback-${qIndex}`);

      resetOptionStyles(qIndex);

      if (!selected) {
        feedbackEl.textContent = "Choose an answer first 😊";
        feedbackEl.classList.remove("correct", "incorrect");
        return;
      }

      const chosenIndex = Number(selected.value);
      const correctIndex = qObj.correctIndex;

      const labels = document.querySelectorAll(`label.option-label[data-q="${qIndex}"]`);
      labels.forEach(label => {
        const opt = Number(label.dataset.opt);
        if (opt === correctIndex) {
          label.classList.add("correct");
        } else if (opt === chosenIndex && chosenIndex !== correctIndex) {
          label.classList.add("chosen-wrong");
        }
      });

      if (chosenIndex === correctIndex) {
        feedbackEl.textContent = "Correct! 🎉";
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
        questionStates[qIndex].score = qObj.maxPoints || 1;
      } else {
        feedbackEl.textContent = `Incorrect – correct answer: ${qObj.options[correctIndex]}`;
        feedbackEl.classList.add("incorrect");
        feedbackEl.classList.remove("correct");
        questionStates[qIndex].score = 0;
      }

      questionStates[qIndex].answered = true;
      updateScoreAndProgress();
    }

    function checkYearQuestion(qIndex, inputEl) {
      const qObj = questions[qIndex];
      const feedbackEl = document.getElementById(`feedback-${qIndex}`);
      const value = parseInt(inputEl.value, 10);

      if (isNaN(value)) {
        feedbackEl.textContent = "Enter a year first 😊";
        feedbackEl.classList.remove("correct", "incorrect");
        return;
      }

      const diff = Math.abs(value - qObj.correctYear);
      let points = 0;
      if (diff === 0) points = 2;
      else if (diff === 1) points = 1;

      questionStates[qIndex].score = points;
      questionStates[qIndex].answered = true;

      if (points === 2) {
        feedbackEl.textContent = `Spot on! ${value} is exactly right (+2).`;
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
      } else if (points === 1) {
        feedbackEl.textContent = `Close! Correct year is ${qObj.correctYear} (+1 for being one year off).`;
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
      } else {
        feedbackEl.textContent = `Incorrect – correct year is ${qObj.correctYear}.`;
        feedbackEl.classList.add("incorrect");
        feedbackEl.classList.remove("correct");
      }

      updateScoreAndProgress();
    }

    function checkNumberQuestion(qIndex, inputEl) {
      const qObj = questions[qIndex];
      const feedbackEl = document.getElementById(`feedback-${qIndex}`);
      const value = parseInt(inputEl.value, 10);

      if (isNaN(value)) {
        feedbackEl.textContent = "Enter a number first 😊";
        feedbackEl.classList.remove("correct", "incorrect");
        return;
      }

      const correct = value === qObj.correctNumber;
      questionStates[qIndex].score = correct ? qObj.maxPoints || 1 : 0;
      questionStates[qIndex].answered = true;

      if (correct) {
        feedbackEl.textContent = "Correct! 🎉";
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
      } else {
        feedbackEl.textContent = `Incorrect – correct answer: ${qObj.correctNumber}.`;
        feedbackEl.classList.add("incorrect");
        feedbackEl.classList.remove("correct");
      }

      updateScoreAndProgress();
    }

    function checkTextExactQuestion(qIndex, inputEl) {
      const qObj = questions[qIndex];
      const feedbackEl = document.getElementById(`feedback-${qIndex}`);
      const value = (inputEl.value || "").trim().toLowerCase();
      if (!value) {
        feedbackEl.textContent = "Type an answer first 😊";
        feedbackEl.classList.remove("correct", "incorrect");
        return;
      }

      const correctText = qObj.answer.trim().toLowerCase();
      const correct = value === correctText;

      questionStates[qIndex].score = correct ? qObj.maxPoints || 1 : 0;
      questionStates[qIndex].answered = true;

      if (correct) {
        feedbackEl.textContent = "Correct! 🎉";
        feedbackEl.classList.add("correct");
        feedbackEl.classList.remove("incorrect");
      } else {
        feedbackEl.textContent = `Incorrect – correct answer: ${qObj.answer}.`;
        feedbackEl.classList.add("incorrect");
        feedbackEl.classList.remove("correct");
      }

      updateScoreAndProgress();
    }

    // ------------------------------
    // SCORE & PROGRESS
    // ------------------------------
    function updateScoreAndProgress() {
      const total = questions.length;

      let correctPoints = 0;
      let answered = 0;
      questionStates.forEach(s => {
        correctPoints += s.score;
        if (s.answered) answered++;
      });

      const percent = totalMaxPoints > 0
        ? Math.round((correctPoints / totalMaxPoints) * 100)
        : 0;

      lastScore = correctPoints;
      lastPercent = percent;

      scoreBox.innerHTML = `
        <div class="percent">${percent}%</div>
        <div class="raw">Currently ${correctPoints} out of ${totalMaxPoints} possible points</div>
      `;

      if (correctPoints > 0) {
        sharePanel.style.display = "flex";
        shareStatus.textContent = "";
      } else {
        sharePanel.style.display = "none";
      }

      const progressPercent = Math.round((answered / total) * 100);
      progressTextEl.textContent = `${answered} / ${total} answered`;
      progressBarEl.style.width = progressPercent + "%";
    }

    updateScoreAndProgress();

    // ------------------------------
    // UNANSWERED QUESTION BUTTON
    // ------------------------------
    jumpUnansweredBtn.addEventListener("click", () => {
      const total = questionStates.length;
      let targetIndex = -1;

      for (let i = 0; i < total; i++) {
        if (!questionStates[i].answered) {
          targetIndex = i;
          break;
        }
      }

      if (targetIndex === -1) {
        shareStatus.textContent = "You've answered every question – nice! 🎉";
        sharePanel.style.display = "flex";
        return;
      }

      const card = document.getElementById(`card-${targetIndex}`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.style.outline = "2px solid var(--neon)";
        setTimeout(() => {
          card.style.outline = "none";
        }, 1400);
      }
    });

    // ------------------------------
    // SHARING (multi-line text)
    // ------------------------------
    const shareWhatsAppBtn = document.getElementById("share-whatsapp");
    const copyResultBtn = document.getElementById("copy-result");

    function buildShareText() {
      const baseLines = [
        `I just played "The Big Fat Sunday Quiz" on Ben's Trivia!`,
        ``,
        `My score: ${lastScore}/${totalMaxPoints} points (${lastPercent}%)`,
        ``,
        `Try to beat my score:`,
        window.location.href
      ];

      return baseLines.join("\n");
    }

    shareWhatsAppBtn.addEventListener("click", () => {
      const text = buildShareText();
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(url, "_blank");
    });

    copyResultBtn.addEventListener("click", async () => {
      const text = buildShareText();
      try {
        await navigator.clipboard.writeText(text);
        shareStatus.textContent = "Copied! Paste into Messenger, Instagram, SMS, etc.";
      } catch (err) {
        shareStatus.textContent = "Couldn't copy automatically – select and copy manually.";
      }
    });
  </script>
</body>
</html>
