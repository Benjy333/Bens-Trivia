<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Unsubscribe | Ben's Trivia</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <style>
    body { margin: 0; min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 36px 16px 48px; text-align: center; }
    .wrap img.logo { display: block; margin: 0 auto 24px; width: 226px; height: auto; border-radius: 10px; }
    .card { padding: 32px 24px; }
    h1 { margin: 0 0 12px; font-size: 1.8rem; }
    .sub { line-height: 1.6; margin: 0 0 22px; }
    .email-display { display: inline-block; max-width: 100%; box-sizing: border-box; margin: 0 0 24px; padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; background: #FFF3DD; border: 1px solid #6E1418; color: #47080A; }
    .buttons { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .buttons button { width: 100%; max-width: 280px; padding: 13px 28px; border-radius: 999px; font-size: .95rem; cursor: pointer; font-weight: 700; }
    .btn-stay { background: transparent !important; color: #6F0C0F !important; border: 1.5px solid #6F0C0F !important; }
    .btn-stay:hover { background: rgba(111,12,15,.08) !important; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 18px; min-height: 1.4em; font-weight: 600; }
    .status.error { color: #8A150E; }
    .footer-link { margin-top: 22px; font-size: .9rem; }
    .footer-link a { font-weight: 600; }
  </style>
  <link rel="stylesheet" href="theme.css?v=53">
</head>
<body>
  <div class="wrap">
    <a href="/"><img class="logo" src="images/logo.png" alt="Ben's Trivia" width="226" height="80"></a>
    <div class="card">
      <h1 class="page-title" id="title">Unsubscribe</h1>
      <p class="sub" id="subtitle">Are you sure you want to stop receiving the weekly quiz email?</p>
      <div class="email-display" id="email-display">Loading…</div>
      <div class="buttons" id="buttons">
        <button class="btn-submit-score" id="btn-unsub">Yes, unsubscribe me</button>
        <button class="btn-stay" id="btn-stay" onclick="window.location='https://benstrivia.com/'">No, keep me subscribed</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="footer-link"><a href="https://benstrivia.com/">&larr; Back to Ben's Trivia</a></div>
  </div>

<script>
const SUPA_KEY = "sb_publishable_LMgLiRKeCPREBMa9r-pEOQ_et-2xo0L";

const params = new URLSearchParams(window.location.search);
const email = (params.get("email") || "").trim();

const emailDisplay = document.getElementById("email-display");
const statusEl = document.getElementById("status");

if (email) {
  emailDisplay.textContent = email;
} else {
  emailDisplay.textContent = "No email found";
  document.getElementById("btn-unsub").disabled = true;
}

document.getElementById("btn-unsub").addEventListener("click", async () => {
  if (!email) return;
  const btn = document.getElementById("btn-unsub");
  btn.disabled = true;
  btn.textContent = "Unsubscribing…";
  statusEl.textContent = ""; statusEl.className = "status";

  try {
    const res = await fetch(
      "https://cxgndxmvyerwejwyitrf.supabase.co/functions/v1/smooth-action/unsubscribe",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPA_KEY, "apikey": SUPA_KEY },
        body: JSON.stringify({ email })
      }
    );
    if (!res.ok) throw new Error("Failed");
    document.getElementById("title").textContent = "You're unsubscribed";
    document.getElementById("subtitle").textContent = "Sorry to see you go! You won't receive any more quiz emails.";
    document.getElementById("buttons").style.display = "none";
    statusEl.textContent = "Successfully unsubscribed.";
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Yes, unsubscribe me";
    statusEl.className = "status error";
    statusEl.textContent = "Something went wrong. Please try again.";
  }
});
</script>
</body>
</html>
